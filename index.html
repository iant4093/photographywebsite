  <style>
/* Loaded by the document itself so the first paint is styled before React starts. */
html { background: #f3efe6; }
html[data-theme="dark"] { background: #171613; }
body { margin: 0; }

.initial-loader {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  place-items: center;
  padding: 24px;
  box-sizing: border-box;
  color: #231f1a;
  background: #f3efe6;
  text-align: center;
  /* Reveal the existing retry message if the application never starts. */
  animation: initial-loader-failsafe 1ms linear 5s forwards;
  transition: opacity 240ms ease, visibility 240ms ease;
}

html[data-theme="dark"] .initial-loader {
  color: #f3efe6;
  background: #171613;
}

.initial-loader.is-leaving {
  animation: none;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.initial-loader__content { width: min(230px, 100%); }

.initial-loader__mark {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  margin: 0 auto 22px;
  border: 1px solid currentColor;
  font: 500 17px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing: .08em;
}

.initial-loader__name {
  margin: 0;
  font: 400 25px/1.15 Iowan Old Style, Baskerville, "Times New Roman", Times, serif;
}

.initial-loader__subtitle {
  margin: 8px 0 24px;
  font: 500 10px/1.2 "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing: .24em;
  text-transform: uppercase;
}

.initial-loader__track {
  height: 1px;
  overflow: hidden;
  background: #cfc5b7;
}

.initial-loader__track span {
  display: block;
  width: 38%;
  height: 100%;
  background: #8a6a4f;
  animation: initial-loader-progress 800ms ease-in-out infinite alternate;
}

html[data-theme="dark"] .initial-loader__track { background: #493f35; }
html[data-theme="dark"] .initial-loader__track span { background: #af9278; }

@keyframes initial-loader-progress {
  from { transform: translateX(-100%); }
  to { transform: translateX(265%); }
}

@keyframes initial-loader-failsafe {
  to { opacity: 0; visibility: hidden; pointer-events: none; }
}

@media (prefers-reduced-motion: reduce) {
  .initial-loader,
  .initial-loader__track span {
    animation: none;
    transition: none;
  }
  .initial-loader { animation: initial-loader-failsafe 1ms linear 5s forwards; }
  .initial-loader__track span { width: 100%; }
}
  </style>
