      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiId
          Value: !Ref Api
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API p95 integration latency exceeds five seconds for two periods.
      Namespace: AWS/ApiGateway
      MetricName: IntegrationLatency
      Dimensions:
        - Name: ApiId
          Value: !Ref Api
        - Name: Stage
          Value: !Ref Stage
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'

  FrontDoorDeniedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: At least ten requests reached API Lambdas without valid CloudFront origin verification in five minutes.
      Namespace: IanTruongPhotography/Security
      MetricName: FrontDoorDenied
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'

  AsyncFailureQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An asynchronous Lambda invocation reached the failure queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AsyncFailureQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'

  PreviewDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A responsive-preview job exhausted its bounded retry budget.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PreviewDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'

  PreviewQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Responsive-preview processing is more than ten minutes behind.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PreviewQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'

  PreviewQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Responsive-preview queue depth remains above the initial processing envelope.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PreviewQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PreviewWorkerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A responsive-preview job logged a privacy-safe failure event.
      Namespace: IanTruongPhotography/PreviewV2
      MetricName: PreviewJobFailure
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  PreviewWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Responsive-preview worker returned a native Lambda error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PreviewWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  PreviewWorkerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Responsive-preview worker p95 duration exceeds 150 seconds.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref PreviewWorkerFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 150000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PreviewWorkerThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Responsive-preview worker concurrency was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref PreviewWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  PreviewMetadataSystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: DynamoDB reported a system error for responsive-preview metadata.
      Namespace: AWS/DynamoDB
      MetricName: SystemErrors
      Dimensions:
        - Name: TableName
          Value: !Ref PreviewMetadataTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'

  PreviewMetadataThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Responsive-preview metadata requests were throttled.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref PreviewMetadataTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LoginThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Login Lambda is being throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref LoginFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AuditFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A security-sensitive application operation recorded a failure outcome.
      Namespace: IanTruongPhotography/Security
      MetricName: AuditFailure
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'

  LoginDeniedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ten or more redacted login denials were recorded in five minutes.
      Namespace: IanTruongPhotography/Security
      MetricName: LoginDenied
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiAuthorizationDeniedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API authentication, authorization, or rate-limit denials exceeded the initial threshold.
      Namespace: IanTruongPhotography/Security
      MetricName: ApiAuthorizationDenied
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: Transitional API Gateway endpoint URL; unavailable after DisableExecuteApiEndpoint is true.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  ApiFrontDoorUrl:
    Condition: ProvisionApiFrontDoorResources
    Description: Same-origin CloudFront origin path target (hostname is not a browser API base).
    Value: !Sub 'https://${ApiFrontDoorDomainName}/api'
  ApiFrontDoorCertificateArn:
    Condition: ProvisionApiFrontDoorResources
    Description: Regional ACM certificate ARN used by guarded CloudFront preflight checks.
    Value: !Ref ApiFrontDoorCertificate
  FrontDoorOriginSecretArn:
    Description: Secrets Manager identifier only; this output never contains the verification value.
    Value: !Ref FrontDoorOriginSecret
  FrontDoorEnforcementEnabled:
    Description: Current staged origin-verification enforcement state.
    Value: !Ref FrontDoorEnforcementEnabled
  ExecuteApiEndpointDisabled:
    Description: Current staged default API endpoint state.
    Value: !Ref DisableExecuteApiEndpoint
  UserPoolId:
    Description: Cognito user pool ID (public client configuration, not a secret)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client ID (public client configuration, not a secret)
    Value: !Ref UserPoolClient
  ImagesBucketName:
    Description: Private media bucket
    Value: !Ref ImagesBucket
  ImagesDistributionId:
    Description: Media CloudFront distribution ID used by guarded invalidation tooling
    Value: !Ref ImagesCloudFront
  MediaAccessLogsBucketDomain:
    Description: S3 domain usable for frontend CloudFront standard logging after explicit opt-in
    Value: !GetAtt MediaAccessLogsBucket.DomainName
  AlarmTopicArn:
    Description: Central encrypted security and operational notification topic.
    Value: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'
  ApplicationLogGroupName:
    Description: Centralized structured Lambda application and security-audit log group.
    Value: !Ref ApplicationLogGroup
  ApplicationLogRetentionDays:
    Description: Configured centralized Lambda application-log retention period.
    Value: !Ref ApplicationLogRetentionDays
  SecurityMetricNamespace:
    Description: Namespace containing privacy-safe application security metrics.
    Value: IanTruongPhotography/Security
  ReleaseSha:
    Description: Source revision included in application audit events.
    Value: !Ref ReleaseSha
  AlbumIndexDeploymentPhase:
    Description: Current conditional GSI rollout phase
    Value: !Ref AlbumIndexDeploymentPhase
  PrivateMediaCloudFrontDenyEnforced:
    Description: Guard state for non-public object-tag enforcement at the media CDN origin
    Value: !Ref EnforcePrivateMediaCloudFrontDeny
