          MetricName: AuditDenied
          MetricValue: '1'
          DefaultValue: 0

  AuditFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApplicationLogGroup
      FilterPattern: '"security_audit" "failure"'
