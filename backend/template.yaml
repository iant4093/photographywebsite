        CreateZipAlbum:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /albums/{albumId}/zip
            Method: POST
            Auth:
              Authorizer: NONE
        CreateZipShared:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /shared/{shareCode}/zip
            Method: POST
            Auth:
              Authorizer: NONE

  WorkerZipFunction:
    Type: AWS::Serverless::Function
    Metadata: *SafePythonBuild
    Properties:
      CodeUri: ./
      Handler: worker_zip.handler
      Timeout: 900
      MemorySize: 1024
      EphemeralStorage:
        Size: 2048
      ReservedConcurrentExecutions: 2
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt AsyncFailureQueue.Arn
      Environment:
        Variables:
          ALBUMS_TABLE: !Ref AlbumsTable
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AlbumsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${AlbumsTable.Arn}/index/ShareCodeIndex'
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${ImagesBucket.Arn}/albums/*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:GetObjectTagging
                - s3:PutObjectTagging
                - s3:AbortMultipartUpload
                - s3:ListMultipartUploadParts
              Resource: !Sub '${ImagesBucket.Arn}/temp-zips/*'
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AsyncFailureQueue.Arn

