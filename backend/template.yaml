  PreviewWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ./
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures:
        - x86_64
      Timeout: 180
      MemorySize: 3072
      EphemeralStorage:
        Size: 1024
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          ALBUMS_TABLE: !Ref AlbumsTable
          PREVIEW_METADATA_TABLE: !Ref PreviewMetadataTable
          IMAGES_BUCKET: !Ref ImagesBucket
          MAX_PREVIEW_SOURCE_BYTES: '104857600'
          MAX_PREVIEW_OUTPUT_BYTES: '20971520'
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt PreviewQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AlbumsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PreviewMetadataTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectVersion
              Resource: !Sub '${ImagesBucket.Arn}/albums/*'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObjectTagging
                - s3:PutObjectTagging
              Resource: !Sub '${ImagesBucket.Arn}/albums/*/preview/v2/*'
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt PreviewDataKey.Arn
      Events:
        PreviewJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt PreviewQueue.Arn
            BatchSize: 2
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2

  CreateZipFunction:
    Type: AWS::Serverless::Function
