AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ian Truong Photography Portfolio - hardened serverless backend

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: '^[a-z0-9-]+$'
  FrontendUrl:
    Type: String
    Default: https://iantruongphotography.com
    AllowedPattern: '^https://[^/]+$'
    Description: Exact browser origin allowed by API Gateway and S3 CORS (no trailing slash).
  FrontendHostname:
    Type: String
    Default: iantruongphotography.com
    AllowedPattern: '^(?=.{1,253}$)([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$'
    Description: Exact Turnstile hostname, without scheme, port, path, or trailing dot.
  ResendApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Transitional legacy value. Prefer ResendApiKeySecretArn and clear this after migration.
  TurnstileSecretKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Transitional legacy value. Prefer TurnstileSecretArn and clear this after migration.
  ResendApiKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Resend API key.
  TurnstileSecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Turnstile secret.
  GoogleOAuthSecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Google OAuth authorized-user JSON.
  ApplicationSecretsKmsKeyArn:
    Type: String
    Default: ''
    Description: Optional customer-managed KMS key ARN used by the application secrets.
  GoogleDriveFolderId:
    Type: String
    Default: ''
  AlbumIndexDeploymentPhase:
    Type: String
    Default: none
    AllowedValues:
      - none
      - visibility
      - both
    Description: >-
      Guarded existing-table migration. Deploy visibility first, wait for ACTIVE and backfill,
      then deploy both. DynamoDB permits only one GSI creation per UpdateTable call.
  EnforcePrivateMediaCloudFrontDeny:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: >-
      Guarded rollout switch. Enable only after object tags are complete, caches are invalidated,
      and private HLS has an authorized segment-delivery design.
  ApiThrottleBurstLimit:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 500
  ApiThrottleRateLimit:
    Type: Number
    Default: 25
    MinValue: 5
    MaxValue: 250
  ApiAccessLogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 120, 180, 365]
  MediaAccessLogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 120, 180, 365, 400]

Conditions:
  HasVisibilityIndex: !Not [!Equals [!Ref AlbumIndexDeploymentPhase, none]]
  HasOwnerIndex: !Equals [!Ref AlbumIndexDeploymentPhase, both]
  HasResendSecret: !Not [!Equals [!Ref ResendApiKeySecretArn, '']]
  HasTurnstileSecret: !Not [!Equals [!Ref TurnstileSecretArn, '']]
  HasGoogleOAuthSecret: !Not [!Equals [!Ref GoogleOAuthSecretArn, '']]
  HasApplicationSecretsKmsKey: !Not [!Equals [!Ref ApplicationSecretsKmsKeyArn, '']]
  EnforcePrivateMediaDeny: !Equals [!Ref EnforcePrivateMediaCloudFrontDeny, 'true']

Globals:
  Function:
    Runtime: python3.12
    Timeout: 25
    MemorySize: 256
    # Public Cognito identifiers are required for defense-in-depth JWT claim
    # validation inside protected and optionally authenticated handlers.
    Environment:
      Variables:
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Tags:
      Application: IanTruongPhotography
      Stage: !Ref Stage

Resources:
  # DynamoDB: retain album data, protect deletion, and enable point-in-time recovery.
  AlbumsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'GoldenHour-Albums-${Stage}'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # DynamoDB encrypts every table at rest with an AWS-owned key by default.
      # Do not declare SSESpecification on this existing table: adding/removing
      # that redundant property is treated as an encryption-mode change and can
      # exhaust DynamoDB's guarded update quota during a rollback.
      AttributeDefinitions:
        - AttributeName: albumId
          AttributeType: S
        - AttributeName: shareCode
          AttributeType: S
        - !If
          - HasVisibilityIndex
          - AttributeName: visibility
            AttributeType: S
          - !Ref AWS::NoValue
        - !If
          - HasVisibilityIndex
          - AttributeName: createdAt
            AttributeType: S
          - !Ref AWS::NoValue
        - !If
          - HasOwnerIndex
          - AttributeName: ownerSub
            AttributeType: S
          - !Ref AWS::NoValue
      KeySchema:
        - AttributeName: albumId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ShareCodeIndex
          KeySchema:
            - AttributeName: shareCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - !If
          - HasVisibilityIndex
          - IndexName: VisibilityCreatedAtIndex
            KeySchema:
              - AttributeName: visibility
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - !Ref AWS::NoValue
        - !If
          - HasOwnerIndex
          - IndexName: OwnerSubCreatedAtIndex
            KeySchema:
              - AttributeName: ownerSub
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: PrivateCustomerData

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'GoldenHour-RateLimits-${Stage}'
      BillingMode: PAY_PER_REQUEST
      # At-rest encryption is mandatory in DynamoDB and uses an AWS-owned key
      # when no customer-managed key is configured.
      AttributeDefinitions:
        - AttributeName: identifier
          AttributeType: S
      KeySchema:
        - AttributeName: identifier
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityTelemetry

  # Per-stack random key used to HMAC privacy-sensitive rate-limit identifiers.
  RateLimitHashSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'HMAC key for privacy-preserving rate limits (${Stage})'
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecuritySecret

  # Private S3 origin. Versioning and retained resources support recovery.
  ImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'goldenhour-images-${AWS::AccountId}-${Stage}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTemporaryZipObjects
            Status: Enabled
            Prefix: temp-zips/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireNoncurrentMediaVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireAbandonedPendingUploads
            Status: Enabled
            Prefix: albums/
            TagFilters:
              - Key: visibility
                Value: pending
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          # S3 does not allow AbortIncompleteMultipartUpload on a lifecycle
          # rule that also filters by object tags, so keep this as a separate
          # prefix-scoped recovery rule.
          - Id: AbortAbandonedAlbumMultipartUploads
            Status: Enabled
            Prefix: albums/
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - Content-Type
              - Range
              - x-amz-tagging
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedOrigins:
              - !Ref FrontendUrl
            ExposedHeaders:
              - ETag
              - Content-Length
              - Content-Range
            MaxAge: 600
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: MixedPublicAndPrivateMedia

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ImagesBucket.Arn
              - !Sub '${ImagesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowThisCloudFrontDistributionReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesCloudFront}'
          - Sid: DenyCloudFrontTemporaryZipReads
            Effect: Deny
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/temp-zips/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesCloudFront}'
          - !If
            - EnforcePrivateMediaDeny
            - Sid: DenyCloudFrontNonPublicTaggedObjects
              Effect: Deny
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub '${ImagesBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesCloudFront}'
                StringNotEquals:
                  s3:ExistingObjectTag/visibility: public
            - !Ref AWS::NoValue

  MediaResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'GoldenHour-Media-Headers-${Stage}'
        Comment: Exact-origin media CORS and browser hardening
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - Content-Type
              - Range
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - !Ref FrontendUrl
          AccessControlExposeHeaders:
            Items:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
          AccessControlMaxAgeSec: 600
          OriginOverride: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: public, max-age=86400
              Override: true

  MediaAccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3045 # CloudFront standard logging v1 requires the log-delivery ACL.
    Properties:
      BucketName: !Sub 'goldenhour-access-logs-${AWS::AccountId}-${Stage}'
      AccessControl: LogDeliveryWrite
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: RetainAccessLogsForAuditWindow
            Status: Enabled
            ExpirationInDays: !Ref MediaAccessLogRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityLogs

  MediaAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaAccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt MediaAccessLogsBucket.Arn
              - !Sub '${MediaAccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  ImagesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'ImagesOAC-${Stage}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ImagesCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2and3
        Comment: !Sub 'GoldenHour Images CDN - ${Stage}'
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ImagesOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
          ResponseHeadersPolicyId: !Ref MediaResponseHeadersPolicy
          Compress: true
        Logging:
          Bucket: !GetAtt MediaAccessLogsBucket.DomainName
          IncludeCookies: false
          Prefix: media/
        PriceClass: PriceClass_100
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaConvertAlbumObjectsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt ImagesBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - albums/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub '${ImagesBucket.Arn}/albums/*'
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  # Cognito: proxy-only password authentication, refresh support, optional TOTP MFA.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'GoldenHour-Users-${Stage}'
      DeletionProtection: ACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      UserPoolTags:
        Application: IanTruongPhotography
        Stage: !Ref Stage

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'GoldenHour-WebClient-${Stage}'
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      UserPoolId: !Ref UserPool
      Description: Admin users with write access

  # API access logs intentionally omit request/response bodies, tokens, email, and query strings.
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/apigateway/ian-photography-${Stage}'
      RetentionInDays: !Ref ApiAccessLogRetentionDays

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      FailOnWarnings: true
      PropagateTags: true
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
        AllowHeaders: [Content-Type, Authorization, X-Turnstile-Token]
        AllowOrigins:
          - !Ref FrontendUrl
        MaxAge: 600
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit
      Tags:
        Application: IanTruongPhotography
        Stage: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  AsyncFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ian-photography-async-failures-${Stage}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: OperationalFailurePayloads

  # Public: list public albums. Backend must ignore client attempts to widen visibility.
  GetAlbumsFunction:
    Type: AWS::Serverless::Function
    Metadata: &SafePythonBuild
      BuildMethod: makefile
    Properties:
      CodeUri: ./
      Handler: get_albums.handler
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          ALBUMS_TABLE: !Ref AlbumsTable
          IMAGES_BUCKET: !Ref ImagesBucket
          CLOUDFRONT_DOMAIN: !GetAtt ImagesCloudFront.DomainName
          VISIBILITY_CREATED_AT_INDEX: VisibilityCreatedAtIndex
          OWNER_SUB_CREATED_AT_INDEX: OwnerSubCreatedAtIndex
          ALBUM_INDEX_DEPLOYMENT_PHASE: !Ref AlbumIndexDeploymentPhase
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AlbumsTable
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ImagesBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: albums/*
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${ImagesBucket.Arn}/albums/*'
      Events:
        GetAlbums:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /albums
            Method: GET
            Auth:
              Authorizer: NONE

  GetAlbumFunction:
    Type: AWS::Serverless::Function
    Metadata: *SafePythonBuild
    Properties:
      CodeUri: ./
      Handler: get_album.handler
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          ALBUMS_TABLE: !Ref AlbumsTable
          IMAGES_BUCKET: !Ref ImagesBucket
          CLOUDFRONT_DOMAIN: !GetAtt ImagesCloudFront.DomainName
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AlbumsTable
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ImagesBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: albums/*
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${ImagesBucket.Arn}/albums/*'
      Events:
        GetAlbum:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /albums/{albumId}
            Method: GET
            Auth:
              Authorizer: NONE

  GetSharedAlbumFunction:
    Type: AWS::Serverless::Function
    Metadata: *SafePythonBuild
    Properties:
      CodeUri: ./
      Handler: get_shared_album.handler
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          ALBUMS_TABLE: !Ref AlbumsTable
          IMAGES_BUCKET: !Ref ImagesBucket
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          RATE_LIMIT_HASH_SECRET_ARN: !Ref RateLimitHashSecret
          CLOUDFRONT_DOMAIN: !GetAtt ImagesCloudFront.DomainName
          TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
          TURNSTILE_SECRET_ARN: !Ref TurnstileSecretArn
          TURNSTILE_EXPECTED_HOSTNAMES: !Ref FrontendHostname
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${AlbumsTable.Arn}/index/ShareCodeIndex'
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RateLimitTable.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref RateLimitHashSecret
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${ImagesBucket.Arn}/albums/*'
        - !If
          - HasTurnstileSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref TurnstileSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasApplicationSecretsKmsKey
          - Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref ApplicationSecretsKmsKeyArn
          - !Ref AWS::NoValue
      Events:
        GetSharedAlbum:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /shared/{shareCode}
            Method: GET
            Auth:
              Authorizer: NONE

  LoginFunction:
    Type: AWS::Serverless::Function
    Metadata: *SafePythonBuild
    Properties:
      CodeUri: ./
      Handler: login.handler
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          RATE_LIMIT_HASH_SECRET_ARN: !Ref RateLimitHashSecret
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
          TURNSTILE_SECRET_ARN: !Ref TurnstileSecretArn
          TURNSTILE_EXPECTED_HOSTNAMES: !Ref FrontendHostname
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RateLimitTable.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref RateLimitHashSecret
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
              Resource: !GetAtt UserPool.Arn
        - !If
          - HasTurnstileSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref TurnstileSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasApplicationSecretsKmsKey
          - Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref ApplicationSecretsKmsKeyArn
          - !Ref AWS::NoValue
      Events:
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /login
            Method: POST
            Auth:
