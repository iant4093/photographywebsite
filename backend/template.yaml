  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'ian-photography-alarms-${Stage}'
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Gateway has at least five server errors in five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiId
          Value: !Ref Api
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API p95 integration latency exceeds five seconds for two periods.
      Namespace: AWS/ApiGateway
      MetricName: IntegrationLatency
      Dimensions:
        - Name: ApiId
          Value: !Ref Api
        - Name: Stage
          Value: !Ref Stage
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  AsyncFailureQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An asynchronous Lambda invocation reached the failure queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AsyncFailureQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  LoginThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Login Lambda is being throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref LoginFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  UserPoolId:
    Description: Cognito user pool ID (public client configuration, not a secret)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client ID (public client configuration, not a secret)
    Value: !Ref UserPoolClient
  ImagesBucketName:
    Description: Private media bucket
    Value: !Ref ImagesBucket
  ImagesDistributionId:
    Description: Media CloudFront distribution ID used by guarded invalidation tooling
    Value: !Ref ImagesCloudFront
  MediaAccessLogsBucketDomain:
    Description: S3 domain usable for frontend CloudFront standard logging after explicit opt-in
    Value: !GetAtt MediaAccessLogsBucket.DomainName
  AlarmTopicArn:
    Description: Subscribe an operational destination after deployment; the template adds no public subscription.
    Value: !Ref AlarmTopic
  AlbumIndexDeploymentPhase:
    Description: Current conditional GSI rollout phase
    Value: !Ref AlbumIndexDeploymentPhase
  PrivateMediaCloudFrontDenyEnforced:
    Description: Guard state for non-public object-tag enforcement at the media CDN origin
    Value: !Ref EnforcePrivateMediaCloudFrontDeny
