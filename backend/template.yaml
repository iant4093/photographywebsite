AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ian Truong Photography Portfolio - hardened serverless backend

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: '^[a-z0-9-]+$'
  FrontendUrl:
    Type: String
    Default: https://iantruongphotography.com
    AllowedPattern: '^https://[^/]+$'
    Description: Exact browser origin allowed by API Gateway and S3 CORS (no trailing slash).
  FrontendHostname:
    Type: String
    Default: iantruongphotography.com
    AllowedPattern: '^(?=.{1,253}$)([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$'
    Description: Exact Turnstile hostname, without scheme, port, path, or trailing dot.
  ResendApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Transitional legacy value. Prefer ResendApiKeySecretArn and clear this after migration.
  TurnstileSecretKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Transitional legacy value. Prefer TurnstileSecretArn and clear this after migration.
  ResendApiKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Resend API key.
  TurnstileSecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Turnstile secret.
  GoogleOAuthSecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Google OAuth authorized-user JSON.
  ApplicationSecretsKmsKeyArn:
    Type: String
    Default: ''
    Description: Optional customer-managed KMS key ARN used by the application secrets.
  GoogleDriveFolderId:
    Type: String
    Default: ''
  AlbumIndexDeploymentPhase:
    Type: String
    Default: none
    AllowedValues:
      - none
      - visibility
      - summary
      - both
    Description: >-
      Guarded existing-table migration. Deploy visibility first, then summary, then both,
      waiting for each new index to become ACTIVE. DynamoDB permits only one GSI creation
      per UpdateTable call.
  EnforcePrivateMediaCloudFrontDeny:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: >-
      Guarded rollout switch. Enable only after object tags are complete, caches are invalidated,
      and private HLS has an authorized segment-delivery design.
  ApiThrottleBurstLimit:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 500
  ApiThrottleRateLimit:
    Type: Number
    Default: 25
    MinValue: 5
    MaxValue: 250
  ApiAccessLogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 120, 180, 365]
  MediaAccessLogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 120, 180, 365, 400]
  ApplicationLogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 120, 180, 365, 400]
    Description: Retention for the centralized structured Lambda application log group.
  ReleaseSha:
    Type: String
    Default: unknown
    AllowedPattern: '^(unknown|[A-Fa-f0-9]{7,64})$'
    Description: Immutable source revision included in privacy-safe application audit events.
  ProvisionApiFrontDoor:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: >-
      Staged switch that creates the retained regional API custom domain, mapping, certificate,
      and Route53 alias. Keep false until the hosted-zone parameter is reviewed.
  ApiFrontDoorDomainName:
    Type: String
    Default: origin-api.iantruongphotography.com
    AllowedPattern: '^(?=.{1,253}$)([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$'
    Description: Dedicated regional API origin hostname; never expose it as the browser API base.
  ApiFrontDoorHostedZoneId:
    Type: String
    Default: ''
    AllowedPattern: '^(|Z[A-Z0-9]{1,31})$'
    Description: Exact public Route53 hosted-zone ID required only when ProvisionApiFrontDoor is true.
  FrontDoorEnforcementEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: >-
      Fail-closed origin-header enforcement. Enable only after CloudFront /api canaries pass and
      direct custom-domain and execute-api negative tests succeed.
  FrontDoorSecretCacheTtlSeconds:
    Type: Number
    Default: 300
    MinValue: 5
    MaxValue: 3600
    Description: Maximum Lambda process-local cache time for the current/previous origin values.
  DisableExecuteApiEndpoint:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Final rollout switch; keep false until same-origin CloudFront API tests pass.

Rules:
  ApiFrontDoorProvisioningRequiresHostedZone:
    RuleCondition: !Equals [!Ref ProvisionApiFrontDoor, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref ApiFrontDoorHostedZoneId, '']]
        AssertDescription: ApiFrontDoorHostedZoneId is required when provisioning the custom domain.
  FrontDoorEnforcementRequiresClosedBypass:
    RuleCondition: !Equals [!Ref FrontDoorEnforcementEnabled, 'true']
    Assertions:
      - Assert: !Equals [!Ref ProvisionApiFrontDoor, 'true']
        AssertDescription: The retained API custom domain must be provisioned before enforcement.
      - Assert: !Equals [!Ref DisableExecuteApiEndpoint, 'true']
        AssertDescription: The default execute-api endpoint must be disabled when enforcement is enabled.

Conditions:
  HasVisibilityIndex: !Not [!Equals [!Ref AlbumIndexDeploymentPhase, none]]
  HasSummaryIndex: !Or
    - !Equals [!Ref AlbumIndexDeploymentPhase, summary]
    - !Equals [!Ref AlbumIndexDeploymentPhase, both]
  HasOwnerIndex: !Equals [!Ref AlbumIndexDeploymentPhase, both]
  HasResendSecret: !Not [!Equals [!Ref ResendApiKeySecretArn, '']]
  HasTurnstileSecret: !Not [!Equals [!Ref TurnstileSecretArn, '']]
  HasGoogleOAuthSecret: !Not [!Equals [!Ref GoogleOAuthSecretArn, '']]
  HasApplicationSecretsKmsKey: !Not [!Equals [!Ref ApplicationSecretsKmsKeyArn, '']]
  EnforcePrivateMediaDeny: !Equals [!Ref EnforcePrivateMediaCloudFrontDeny, 'true']
  ProvisionApiFrontDoorResources: !Equals [!Ref ProvisionApiFrontDoor, 'true']
  DisableDefaultApiEndpoint: !Equals [!Ref DisableExecuteApiEndpoint, 'true']

Globals:
  Function:
    Runtime: python3.12
    Timeout: 25
    MemorySize: 256
    # Public Cognito identifiers are required for defense-in-depth JWT claim
    # validation inside protected and optionally authenticated handlers.
    Environment:
      Variables:
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        APPLICATION_STAGE: !Ref Stage
        RELEASE_SHA: !Ref ReleaseSha
        FRONT_DOOR_CONFIG_ARN: !Ref FrontDoorOriginSecret
        FRONT_DOOR_ENFORCEMENT_ENABLED: !Ref FrontDoorEnforcementEnabled
        FRONT_DOOR_SECRET_CACHE_TTL_SECONDS: !Ref FrontDoorSecretCacheTtlSeconds
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
      LogGroup: !Ref ApplicationLogGroup
    Tags:
      Application: IanTruongPhotography
      Stage: !Ref Stage

Resources:
  # DynamoDB: retain album data, protect deletion, and enable point-in-time recovery.
  AlbumsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'GoldenHour-Albums-${Stage}'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # DynamoDB encrypts every table at rest with an AWS-owned key by default.
      # Do not declare SSESpecification on this existing table: adding/removing
      # that redundant property is treated as an encryption-mode change and can
      # exhaust DynamoDB's guarded update quota during a rollback.
      AttributeDefinitions:
        - AttributeName: albumId
          AttributeType: S
        - AttributeName: shareCode
          AttributeType: S
        - !If
          - HasVisibilityIndex
          - AttributeName: visibility
            AttributeType: S
          - !Ref AWS::NoValue
        - !If
          - HasVisibilityIndex
          - AttributeName: createdAt
            AttributeType: S
          - !Ref AWS::NoValue
        - !If
          - HasOwnerIndex
          - AttributeName: ownerSub
            AttributeType: S
          - !Ref AWS::NoValue
      KeySchema:
        - AttributeName: albumId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ShareCodeIndex
          KeySchema:
            - AttributeName: shareCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - !If
          - HasVisibilityIndex
          - IndexName: VisibilityCreatedAtIndex
            KeySchema:
              - AttributeName: visibility
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - !Ref AWS::NoValue
        - !If
          - HasSummaryIndex
          - IndexName: VisibilityCreatedAtSummaryIndex
            KeySchema:
              - AttributeName: visibility
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - status
                - type
                - title
                - description
                - category
                - imageCount
                - coverImageUrl
                - coverThumbKey
                - coverBlurhash
                - legacyS3Prefix
          - !Ref AWS::NoValue
        - !If
          - HasOwnerIndex
          - IndexName: OwnerSubCreatedAtIndex
            KeySchema:
              - AttributeName: ownerSub
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: PrivateCustomerData

  PreviewDataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'Responsive preview metadata and queue encryption (${Stage})'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIAMPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: PrivateCustomerData

  PreviewDataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/ian-photography-preview-${Stage}'
      TargetKeyId: !Ref PreviewDataKey

  PreviewMetadataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'GoldenHour-PreviewMetadata-${Stage}'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt PreviewDataKey.Arn
      AttributeDefinitions:
        - AttributeName: albumId
          AttributeType: S
        - AttributeName: mediaId
          AttributeType: S
      KeySchema:
        - AttributeName: albumId
          KeyType: HASH
        - AttributeName: mediaId
          KeyType: RANGE
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: PrivateCustomerData

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'GoldenHour-RateLimits-${Stage}'
      BillingMode: PAY_PER_REQUEST
      # Keep the security telemetry recoverable and satisfy the account-wide
      # DynamoDB PITR posture rule. TTL still bounds normal record lifetime;
      # PITR is only for incident recovery from accidental or malicious writes.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # At-rest encryption is mandatory in DynamoDB and uses an AWS-owned key
      # when no customer-managed key is configured.
      AttributeDefinitions:
        - AttributeName: identifier
          AttributeType: S
      KeySchema:
        - AttributeName: identifier
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityTelemetry

  # Per-stack random key used to HMAC privacy-sensitive rate-limit identifiers.
  RateLimitHashSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'HMAC key for privacy-preserving rate limits (${Stage})'
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecuritySecret

  # Generated JSON contract: {"current":"<generated>","previous":""}.
  # Rotation first moves the old current value into previous, then changes
  # current.  Remove previous only after CloudFront and every Lambda cache have
  # used the new current value for longer than the configured cache TTL.
  FrontDoorOriginSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'ian-photography/front-door/${Stage}'
      Description: !Sub 'CloudFront to HTTP API origin verification (${Stage})'
      GenerateSecretString:
        SecretStringTemplate: '{"previous":""}'
        GenerateStringKey: current
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecuritySecret

  FrontDoorOriginSecretReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Read-only access to the exact generated CloudFront origin-verification secret
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadExactFrontDoorOriginSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref FrontDoorOriginSecret

  ApiFrontDoorCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: ProvisionApiFrontDoorResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref ApiFrontDoorDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiFrontDoorDomainName
          HostedZoneId: !Ref ApiFrontDoorHostedZoneId
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  ApiFrontDoorDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: ProvisionApiFrontDoorResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref ApiFrontDoorDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiFrontDoorCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags:
        Application: IanTruongPhotography
        Stage: !Ref Stage

  ApiFrontDoorMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: ProvisionApiFrontDoorResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - ApiFrontDoorDomain
      - ApiStage
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref ApiFrontDoorDomainName
      Stage: !Ref Stage
      ApiMappingKey: api

  ApiFrontDoorAlias:
    Type: AWS::Route53::RecordSet
    Condition: ProvisionApiFrontDoorResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      HostedZoneId: !Ref ApiFrontDoorHostedZoneId
      Name: !Ref ApiFrontDoorDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiFrontDoorDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiFrontDoorDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  # Private S3 origin. Versioning and retained resources support recovery.
  ImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'goldenhour-images-${AWS::AccountId}-${Stage}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref MediaAccessLogsBucket
        LogFilePrefix: s3-media/
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTemporaryZipObjects
            Status: Enabled
            Prefix: temp-zips/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireNoncurrentMediaVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireAbandonedPendingUploads
            Status: Enabled
            Prefix: albums/
            TagFilters:
              - Key: visibility
                Value: pending
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          # S3 does not allow AbortIncompleteMultipartUpload on a lifecycle
          # rule that also filters by object tags, so keep this as a separate
          # prefix-scoped recovery rule.
          - Id: AbortAbandonedAlbumMultipartUploads
            Status: Enabled
            Prefix: albums/
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - Content-Type
              - Range
              - x-amz-tagging
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedOrigins:
              - !Ref FrontendUrl
            ExposedHeaders:
              - ETag
              - Content-Length
              - Content-Range
            MaxAge: 600
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: MixedPublicAndPrivateMedia

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ImagesBucket.Arn
              - !Sub '${ImagesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowThisCloudFrontDistributionReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesCloudFront}'
          - Sid: DenyCloudFrontTemporaryZipReads
            Effect: Deny
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/temp-zips/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesCloudFront}'
          # Preview V2 is always tag-enforced, independently of the guarded
          # legacy-media rollout switch. Its zero-TTL edge policy makes every
          # uncached browser request re-evaluate this origin authorization.
          - Sid: DenyCloudFrontNonPublicPreviewV2
            Effect: Deny
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/albums/*/preview/v2/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesCloudFront}'
              StringNotEquals:
                s3:ExistingObjectTag/visibility: public
          - !If
            - EnforcePrivateMediaDeny
            - Sid: DenyCloudFrontNonPublicTaggedObjects
              Effect: Deny
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub '${ImagesBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesCloudFront}'
                StringNotEquals:
                  s3:ExistingObjectTag/visibility: public
            - !Ref AWS::NoValue

  PreviewMediaCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'GoldenHour-PreviewV2-OriginAuth-${Stage}'
        Comment: Recheck S3 visibility tags while browsers retain immutable versioned previews
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  PreviewMediaResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'GoldenHour-PreviewV2-Headers-${Stage}'
        Comment: Exact-origin CORS, hardening, and immutable browser caching for versioned previews
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - Content-Type
              - Range
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - !Ref FrontendUrl
          AccessControlExposeHeaders:
            Items:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
          AccessControlMaxAgeSec: 600
          OriginOverride: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: public, max-age=31536000, immutable
              Override: true

  HeroMediaCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'GoldenHour-Hero-${Stage}'
        Comment: Cache the fixed hero at the edge while browsers revalidate after admin overwrites
        DefaultTTL: 86400
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  HeroMediaResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'GoldenHour-Hero-Headers-${Stage}'
        Comment: Harden hero responses and force browser revalidation after path invalidation
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - Content-Type
              - Range
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - !Ref FrontendUrl
          AccessControlExposeHeaders:
            Items:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
          AccessControlMaxAgeSec: 600
          OriginOverride: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: public, max-age=0, must-revalidate
              Override: true

  MediaResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'GoldenHour-Media-Headers-${Stage}'
        Comment: Exact-origin media CORS and browser hardening
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - Content-Type
              - Range
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - !Ref FrontendUrl
          AccessControlExposeHeaders:
            Items:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
          AccessControlMaxAgeSec: 600
          OriginOverride: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: public, max-age=86400
              Override: true

  MediaAccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3045 # CloudFront standard logging v1 requires the log-delivery ACL.
    Properties:
      BucketName: !Sub 'goldenhour-access-logs-${AWS::AccountId}-${Stage}'
      AccessControl: LogDeliveryWrite
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: RetainAccessLogsForAuditWindow
            Status: Enabled
            ExpirationInDays: !Ref MediaAccessLogRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityLogs

  MediaAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaAccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt MediaAccessLogsBucket.Arn
              - !Sub '${MediaAccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowImagesBucketServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${MediaAccessLogsBucket.Arn}/s3-media/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !GetAtt ImagesBucket.Arn

  ImagesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'ImagesOAC-${Stage}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ImagesCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2and3
        Comment: !Sub 'GoldenHour Images CDN - ${Stage}'
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ImagesOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
          ResponseHeadersPolicyId: !Ref MediaResponseHeadersPolicy
          Compress: true
        CacheBehaviors:
          - PathPattern: 'site/hero/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref HeroMediaCachePolicy
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
            ResponseHeadersPolicyId: !Ref HeroMediaResponseHeadersPolicy
            Compress: false
          - PathPattern: 'albums/*/preview/v2/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref PreviewMediaCachePolicy
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
            ResponseHeadersPolicyId: !Ref PreviewMediaResponseHeadersPolicy
            Compress: false
        Logging:
          Bucket: !GetAtt MediaAccessLogsBucket.DomainName
          IncludeCookies: false
          Prefix: media/
        PriceClass: PriceClass_100
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaConvertAlbumObjectsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt ImagesBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - albums/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub '${ImagesBucket.Arn}/albums/*'
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  # Cognito: proxy-only password authentication, refresh support, optional TOTP MFA.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'GoldenHour-Users-${Stage}'
      DeletionProtection: ACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      UserPoolTags:
        Application: IanTruongPhotography
        Stage: !Ref Stage

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'GoldenHour-WebClient-${Stage}'
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      UserPoolId: !Ref UserPool
      Description: Admin users with write access

  # API access logs intentionally omit request/response bodies, tokens, email, and query strings.
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/apigateway/ian-photography-${Stage}'
      RetentionInDays: !Ref ApiAccessLogRetentionDays

  # One retained group keeps Lambda application/audit events queryable and lets
  # every handler share the same redaction filters, metrics, and retention rule.
  # Existing per-function groups are intentionally left untouched for rollback.
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/ian-photography/application/${Stage}'
      RetentionInDays: !Ref ApplicationLogRetentionDays
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityTelemetry

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # SAM merges the endpoint-disable extension below into every OpenAPI
      # server object. Keep an explicit, root-relative server URL so the
      # transformed document remains valid OpenAPI without referring back to
      # this API's generated ID or coupling the import to a deployment stage or
      # custom domain. API Gateway stage and domain mappings remain managed by
      # their dedicated CloudFormation resources.
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Ref AWS::StackName
          version: '1.0'
        servers:
          - url: /
        paths: {}
      DisableExecuteApiEndpoint: !If [DisableDefaultApiEndpoint, true, false]
      FailOnWarnings: true
      PropagateTags: true
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
        AllowHeaders: [Content-Type, Authorization, X-Turnstile-Token]
        AllowOrigins:
          - !Ref FrontendUrl
        MaxAge: 600
      AccessLogSettings:
        # AWS::Logs::LogGroup.Arn includes a trailing ':*', but API Gateway
        # persists the access-log destination as the exact log-group ARN.
        # Build that exact ARN from Ref (the existing group name) so drift
        # detection compares like-for-like without replacing the log group.
        DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiAccessLogGroup}'
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit
      Tags:
        Application: IanTruongPhotography
        Stage: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  AsyncFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ian-photography-async-failures-${Stage}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: OperationalFailurePayloads

  PreviewDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ian-photography-preview-dlq-${Stage}'
      KmsMasterKeyId: !GetAtt PreviewDataKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: OperationalFailurePayloads

  PreviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ian-photography-preview-${Stage}'
      KmsMasterKeyId: !GetAtt PreviewDataKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 1080
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PreviewDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: OperationalWorkPayloads

  # Anonymous-only catalog routes contain no JWT dependency or protected-data
