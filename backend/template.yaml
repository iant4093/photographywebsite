          RATE_LIMIT_HASH_SECRET_ARN: !Ref RateLimitHashSecret
          WORKER_FUNCTION_NAME: !Ref WorkerZipFunction
      Policies:
        - !Ref FrontDoorOriginSecretReadPolicy
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AlbumsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${AlbumsTable.Arn}/index/ShareCodeIndex'
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RateLimitTable.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref RateLimitHashSecret
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ImagesBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: temp-zips/*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:PutObjectTagging
              Resource: !Sub '${ImagesBucket.Arn}/temp-zips/*'
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt WorkerZipFunction.Arn
        - !If
          - HasApplicationSecretsKmsKey
          - Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref ApplicationSecretsKmsKeyArn
          - !Ref AWS::NoValue
