AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Retained us-east-1 CloudFront-scope WAF for the photography website single front door.
  High-confidence managed rules block known-bad and reputation-listed traffic.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: '^[a-z0-9-]+$'
  WafLogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 120, 180, 365]
  SecurityEventBusArn:
    Type: String
    Default: ''
    AllowedPattern: '^(|arn:[A-Za-z0-9-]+:events:us-west-2:[0-9]{12}:event-bus/default)$'
    Description: Optional same-account us-west-2 default event bus for privacy-safe WAF alarm forwarding.
  LogsKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^(|arn:[A-Za-z0-9-]+:kms:[A-Za-z0-9-]+:[0-9]{12}:key/[A-Fa-f0-9-]+)$'
    Description: Optional existing KMS key whose policy already permits CloudWatch Logs in us-east-1.

Conditions:
  HasSecurityEventBus: !Not [!Equals [!Ref SecurityEventBusArn, '']]
  HasLogsKmsKey: !Not [!Equals [!Ref LogsKmsKeyArn, '']]

Resources:
  FrontDoorWebAcl:
    Type: AWS::WAFv2::WebACL
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'IanPhotography-FrontDoor-${Stage}'
      Description: Cost-conscious protection for the canonical frontend and same-origin API
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'IanPhotographyFrontDoor-${Stage}'
        SampledRequestsEnabled: false
      Rules:
        - Name: AWSManagedKnownBadInputs
          Priority: 20
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedKnownBadInputsCount
            SampledRequestsEnabled: false
        - Name: AWSManagedAmazonIpReputation
          Priority: 30
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedAmazonIpReputationCount
            SampledRequestsEnabled: false
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DeploymentMode
          Value: SelectiveBlock

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub 'aws-waf-logs-ian-photography-front-door-${Stage}'
      RetentionInDays: !Ref WafLogRetentionDays
      KmsKeyId: !If [HasLogsKmsKey, !Ref LogsKmsKeyArn, !Ref AWS::NoValue]
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityTelemetry

  WafLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt FrontDoorWebAcl.Arn
      LogDestinationConfigs:
        - !GetAtt WafLogGroup.Arn
      RedactedFields:
        - SingleHeader:
            Name: authorization
        - SingleHeader:
            Name: cookie
        - SingleHeader:
            Name: x-origin-verify
        - QueryString: {}
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition:
                  Action: BLOCK

  WafBlockedRequestAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-waf-blocked-${Stage}'
      AlarmDescription: Front-door WAF emitted a sustained burst of terminating block actions.
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: !Sub 'IanPhotography-FrontDoor-${Stage}'
        - Name: Region
          Value: Global
        - Name: Rule
          Value: ALL
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  WafAlarmForwardRole:
    Type: AWS::IAM::Role
    Condition: HasSecurityEventBus
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ForwardExactWafAlarmEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Ref SecurityEventBusArn

  WafAlarmCrossRegionRule:
    Type: AWS::Events::Rule
    Condition: HasSecurityEventBus
    Properties:
      Name: !Sub 'ian-photography-waf-cross-region-${Stage}'
      Description: Forwards exact WAF alarm state changes to the home-region security event bus.
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change]
        resources:
          - prefix: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-waf-'
        detail:
          alarmName:
            - !Sub 'ian-photography-waf-blocked-${Stage}'
      State: ENABLED
      Targets:
        - Id: HomeRegionSecurityBus
          Arn: !Ref SecurityEventBusArn
          RoleArn: !GetAtt WafAlarmForwardRole.Arn

Outputs:
  WebAclArn:
    Description: Associate this exact ARN through the guarded frontend CloudFront tool.
    Value: !GetAtt FrontDoorWebAcl.Arn
  WebAclId:
    Value: !GetAtt FrontDoorWebAcl.Id
  WafLogGroupName:
    Description: Privacy-filtered BLOCK security telemetry with no request sampling.
    Value: !Ref WafLogGroup
  WafDeploymentMode:
    Description: Known-bad input and IP reputation managed rules block.
    Value: SELECTIVE_BLOCK
  WafAlarmCrossRegionRouting:
    Description: Whether exact WAF alarm transitions are forwarded to the home-region security bus.
    Value: !If [HasSecurityEventBus, ENABLED, DISABLED]
