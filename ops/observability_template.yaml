AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Free CloudFront edge observability for Ian Truong Photography. The stack
  owns a dashboard of free metrics without paid monitoring subscriptions; it does not collect browser telemetry or run
  synthetic browser probes.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod, staging]
  ReleaseSha:
    Type: String
    Default: unknown
    AllowedPattern: '^(unknown|[0-9a-f]{40})$'
    Description: Exact tested Git revision; unknown is permitted only for initial manual staging.
  FrontendDistributionId:
    Type: String
    AllowedPattern: '^[A-Z0-9]{12,20}$'
  MediaDistributionId:
    Type: String
    AllowedPattern: '^[A-Z0-9]{12,20}$'

Rules:
  MustDeployInApplicationRegion:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-west-2]
        AssertDescription: The observability stack must be deployed in us-west-2.
  DistributionIdsMustBeDistinct:
    Assertions:
      - Assert: !Not [!Equals [!Ref FrontendDistributionId, !Ref MediaDistributionId]]
        AssertDescription: Frontend and media distributions must have distinct IDs.

Resources:
  ObservabilityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'ian-photography-observability-${Stage}'
      DashboardBody: !Sub |
        {
          "start": "-P7D",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# Ian Truong Photography edge observability\nRelease `${ReleaseSha}`. Browser telemetry and synthetic browser probes are intentionally disabled."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 2,
              "width": 24,
              "height": 8,
              "properties": {
                "title": "CloudFront edge health",
                "region": "us-east-1",
                "stat": "Average",
                "metrics": [
                  ["AWS/CloudFront", "5xxErrorRate", "DistributionId", "${FrontendDistributionId}", "Region", "Global", {"label": "Frontend 5xx"}],
                  [".", "Requests", ".", ".", ".", ".", {"label": "Frontend requests"}],
                  [".", "4xxErrorRate", ".", ".", ".", ".", {"label": "Frontend 4xx"}],
                  ["AWS/CloudFront", "5xxErrorRate", "DistributionId", "${MediaDistributionId}", "Region", "Global", {"label": "Media 5xx"}],
                  [".", "Requests", ".", ".", ".", ".", {"label": "Media requests"}],
                  [".", "4xxErrorRate", ".", ".", ".", ".", {"label": "Media 4xx"}]
                ]
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Value: !Ref ObservabilityDashboard
