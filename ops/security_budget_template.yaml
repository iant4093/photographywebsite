AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Guarded monthly cost budget for photography security and observability
  services. An optional owner email receives free AWS Budgets alerts when actual
  or forecasted spend exceeds the limit; it creates no SNS or other route.

Parameters:
  Stage:
    Type: String
    Default: prod
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,18}[a-z0-9])?$'
  ExpectedAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: Exact caller account confirmed by the read-only preflight.
  BudgetDeploymentMode:
    Type: String
    Default: skip
    AllowedValues: [skip, create-confirmed-absent]
  MonthlyLimitUsd:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100000
    Description: Owner-approved monthly USD limit; zero is valid only in skip mode.
  BudgetAlertEmail:
    Type: String
    Default: ''
    NoEcho: true
    MaxLength: 254
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: >-
      Optional owner email for ACTUAL and FORECASTED over-100-percent alerts.
      Empty creates no notification. Supply it only at deploy time; notifications
      are create-only, so a later change requires replacing the budget.
Rules:
  ExpectedAccountMustMatch:
    Assertions:
      - Assert: !Equals [!Ref ExpectedAccountId, !Ref AWS::AccountId]
        AssertDescription: ExpectedAccountId must equal the deployment account.
  MustDeployInHomeRegion:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-west-2]
        AssertDescription: The account budget stack is managed from us-west-2.
  CreationRequiresApprovedLimit:
    RuleCondition: !Equals [!Ref BudgetDeploymentMode, create-confirmed-absent]
    Assertions:
      - Assert: !Not [!Equals [!Ref MonthlyLimitUsd, 0]]
        AssertDescription: An owner-approved positive monthly limit is required.

Conditions:
  CreateBudget: !Equals [!Ref BudgetDeploymentMode, create-confirmed-absent]
  HasBudgetAlertEmail: !Not [!Equals [!Ref BudgetAlertEmail, '']]

Resources:
  MonthlySecurityAndObservabilityBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Budget:
        BudgetName: !Sub 'ian-photography-monthly-${Stage}'
        BudgetLimit:
          Amount: !Ref MonthlyLimitUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostTypes:
          IncludeCredit: true
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: true
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseAmortized: false
          UseBlended: false
      NotificationsWithSubscribers: !If
        - HasBudgetAlertEmail
        - - Notification:
              NotificationType: ACTUAL
              Threshold: 100
              ComparisonOperator: GREATER_THAN
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref BudgetAlertEmail
          - Notification:
              NotificationType: FORECASTED
              Threshold: 100
              ComparisonOperator: GREATER_THAN
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref BudgetAlertEmail
        - !Ref AWS::NoValue
      ResourceTags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  BudgetWasCreated:
    Value: !If [CreateBudget, 'true', 'false']
  BudgetName:
    Condition: CreateBudget
    Value: !Ref MonthlySecurityAndObservabilityBudget
  BudgetEmailAlerts:
    Condition: CreateBudget
    Value: !If [HasBudgetAlertEmail, ACTUAL_AND_FORECASTED_OVER_100_PERCENT, DISABLED]
