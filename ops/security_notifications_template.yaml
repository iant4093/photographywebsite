AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Encrypted security notification routing and audit alarms. This stack creates
  no subscription; attach only an owner-approved monitored destination later.

Parameters:
  Stage:
    Type: String
    Default: prod
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,18}[a-z0-9])?$'
    ConstraintDescription: Use 1-20 lowercase letters, digits, or internal hyphens.
  SecurityAuditLogGroupName:
    Type: String
    MinLength: 1
    MaxLength: 512
    AllowedPattern: '^/[A-Za-z0-9._/#-]+$'
    Description: Exact CloudWatch log group name output by the audit foundation stack.

Resources:
  SecurityNotificationKey:
    Type: AWS::KMS::Key
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts the IanTruongPhotography security notification topic.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowDirectNotificationPublishers
            Effect: Allow
            Principal:
              Service:
                - budgets.amazonaws.com
                - cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                kms:EncryptionContext:aws:sns:topicArn: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'
                kms:ViaService: !Sub 'sns.${AWS::Region}.${AWS::URLSuffix}'
          - Sid: AllowSnsUseForThisTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                kms:EncryptionContext:aws:sns:topicArn: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ian-photography-security-${Stage}'
                kms:ViaService: !Sub 'sns.${AWS::Region}.${AWS::URLSuffix}'
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecurityNotificationKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/ian-photography-security-${Stage}'
      TargetKeyId: !Ref SecurityNotificationKey

  SecurityNotifications:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'ian-photography-security-${Stage}'
      KmsMasterKeyId: !GetAtt SecurityNotificationKey.Arn
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecurityNotificationsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SecurityNotifications
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowExactAccountBudget
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SecurityNotifications
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/ian-photography-monthly-${Stage}'
          - Sid: AllowExactCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SecurityNotifications
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                AWS:SourceArn:
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-root-activity-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-cloudtrail-change-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-iam-change-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-kms-change-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-security-routing-change-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-security-service-change-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-data-protection-change-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-infrastructure-protection-change-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-backup-freshness-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-security-events-dlq-${Stage}'

  SecuritySignalQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ian-photography-security-signals-${Stage}'
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SecurityEventDlq.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecuritySignalQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SecuritySignalQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowExactSecuritySignalRules
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SecuritySignalQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn:
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-guardduty-high-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-guardduty-critical-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-securityhub-high-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-securityhub-critical-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-backup-job-failed-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-backup-copy-failed-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-backup-restore-failed-${Stage}'

  SecurityEventDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ian-photography-security-events-${Stage}-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecurityEventDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SecurityEventDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowExactSecurityRules
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SecurityEventDlq.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn:
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-guardduty-high-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-guardduty-critical-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-securityhub-high-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-securityhub-critical-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-backup-job-failed-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-backup-copy-failed-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-backup-restore-failed-${Stage}'

  SecuritySignalProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ian-photography-security-signal-processor-${Stage}'
      RetentionInDays: 90
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecuritySignalProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ConsumeExactSecuritySignalQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt SecuritySignalQueue.Arn
        - PolicyName: PublishValidatedSecuritySignals
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref SecurityNotifications
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt SecurityNotificationKey.Arn
                Condition:
                  StringEquals:
                    kms:EncryptionContext:aws:sns:topicArn: !Ref SecurityNotifications
                    kms:ViaService: !Sub 'sns.${AWS::Region}.${AWS::URLSuffix}'
        - PolicyName: WriteSecuritySignalProcessorLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt SecuritySignalProcessorLogGroup.Arn
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecuritySignalProcessor:
    Type: AWS::Lambda::Function
    DependsOn: SecuritySignalProcessorLogGroup
    Properties:
      FunctionName: !Sub 'ian-photography-security-signal-processor-${Stage}'
      Description: Validates fixed security signals before publishing to the responder topic.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SecuritySignalProcessorRole.Arn
      MemorySize: 128
      Timeout: 30
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          SECURITY_TOPIC_ARN: !Ref SecurityNotifications
          STAGE: !Ref Stage
      Code:
        ZipFile: |
          import json
          import logging
          import os

          import boto3


          LOG = logging.getLogger()
          LOG.setLevel(logging.INFO)
          SNS = boto3.client("sns")
          TOPIC_ARN = os.environ["SECURITY_TOPIC_ARN"]
          STAGE = os.environ["STAGE"]
          CONTRACTS = {
              "guardduty.finding.high": ("high", "managed-security-findings"),
              "guardduty.finding.critical": ("critical", "managed-security-findings"),
              "securityhub.finding.high": ("high", "managed-security-findings"),
              "securityhub.finding.critical": ("critical", "managed-security-findings"),
              "backup.job.failed": ("high", "backup-job-failure"),
              "backup.copy.failed": ("high", "backup-copy-failure"),
              "backup.restore.failed": ("critical", "backup-restore-failure"),
          }
          KEYS = {"schemaVersion", "eventName", "severity", "stage", "runbook"}


          def _validated(body):
              try:
                  value = json.loads(body)
              except (TypeError, ValueError) as error:
                  raise ValueError("invalid security signal json") from error
              if not isinstance(value, dict) or set(value) != KEYS:
                  raise ValueError("invalid security signal shape")
              contract = CONTRACTS.get(value.get("eventName"))
              if contract is None:
                  raise ValueError("unknown security signal")
              severity, anchor = contract
              expected = {
                  "schemaVersion": 1,
                  "eventName": value["eventName"],
                  "severity": severity,
                  "stage": STAGE,
                  "runbook": "ops/ALARM_REGISTRY.md#" + anchor,
              }
              if value != expected:
                  raise ValueError("security signal contract mismatch")
              return expected


          def handler(event, context):
              records = event.get("Records", []) if isinstance(event, dict) else []
              if len(records) != 1 or not isinstance(records[0], dict):
                  raise ValueError("invalid security signal batch")
              signal = _validated(records[0].get("body"))
              SNS.publish(
                  TopicArn=TOPIC_ARN,
                  Message=json.dumps(signal, sort_keys=True, separators=(",", ":")),
              )
              LOG.info("security_signal_forwarded count=1")
              return {"forwarded": 1}
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecuritySignalProcessorMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt SecuritySignalQueue.Arn
      FunctionName: !Ref SecuritySignalProcessor

  GuardDutyFindingRule:
    Type: AWS::Events::Rule
    DependsOn:
      - SecurityNotificationsPolicy
      - SecuritySignalQueuePolicy
      - SecurityEventDlqPolicy
    Properties:
      Name: !Sub 'ian-photography-guardduty-high-${Stage}'
      EventPattern:
        source: [aws.guardduty]
        detail-type: [GuardDuty Finding]
        detail:
          severity:
            - numeric: ['>=', 7, '<', 9]
      State: ENABLED
      Targets:
        - Id: SecurityNotifications
          Arn: !GetAtt SecuritySignalQueue.Arn
          # Never forward the raw finding: it can contain resource identifiers,
          # network details, object metadata, and other incident evidence that
          # does not belong in a human notification channel.
          Input: !Sub >-
            {"schemaVersion":1,"eventName":"guardduty.finding.high","severity":"high","stage":"${Stage}","runbook":"ops/ALARM_REGISTRY.md#managed-security-findings"}
          DeadLetterConfig:
            Arn: !GetAtt SecurityEventDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 10

  GuardDutyCriticalFindingRule:
    Type: AWS::Events::Rule
    DependsOn:
      - SecuritySignalQueuePolicy
      - SecurityEventDlqPolicy
    Properties:
      Name: !Sub 'ian-photography-guardduty-critical-${Stage}'
      EventPattern:
        source: [aws.guardduty]
        detail-type: [GuardDuty Finding]
        detail:
          severity:
            - numeric: ['>=', 9]
      State: ENABLED
      Targets:
        - Id: SecuritySignals
          Arn: !GetAtt SecuritySignalQueue.Arn
          Input: !Sub >-
            {"schemaVersion":1,"eventName":"guardduty.finding.critical","severity":"critical","stage":"${Stage}","runbook":"ops/ALARM_REGISTRY.md#managed-security-findings"}
          DeadLetterConfig:
            Arn: !GetAtt SecurityEventDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 10

  SecurityHubFindingRule:
    Type: AWS::Events::Rule
    DependsOn:
      - SecurityNotificationsPolicy
      - SecuritySignalQueuePolicy
      - SecurityEventDlqPolicy
    Properties:
      Name: !Sub 'ian-photography-securityhub-high-${Stage}'
      EventPattern:
        source: [aws.securityhub]
        detail-type: [Security Hub Findings - Imported]
        detail:
          findings:
            Severity:
              Label: [HIGH]
            Workflow:
              Status: [NEW, NOTIFIED]
      State: ENABLED
      Targets:
        - Id: SecurityNotifications
          Arn: !GetAtt SecuritySignalQueue.Arn
          Input: !Sub >-
            {"schemaVersion":1,"eventName":"securityhub.finding.high","severity":"high","stage":"${Stage}","runbook":"ops/ALARM_REGISTRY.md#managed-security-findings"}
          DeadLetterConfig:
            Arn: !GetAtt SecurityEventDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 10

  SecurityHubCriticalFindingRule:
    Type: AWS::Events::Rule
    DependsOn:
      - SecuritySignalQueuePolicy
      - SecurityEventDlqPolicy
    Properties:
      Name: !Sub 'ian-photography-securityhub-critical-${Stage}'
      EventPattern:
        source: [aws.securityhub]
        detail-type: [Security Hub Findings - Imported]
        detail:
          findings:
            Severity:
              Label: [CRITICAL]
            Workflow:
              Status: [NEW, NOTIFIED]
      State: ENABLED
      Targets:
        - Id: SecuritySignals
          Arn: !GetAtt SecuritySignalQueue.Arn
          Input: !Sub >-
            {"schemaVersion":1,"eventName":"securityhub.finding.critical","severity":"critical","stage":"${Stage}","runbook":"ops/ALARM_REGISTRY.md#managed-security-findings"}
          DeadLetterConfig:
            Arn: !GetAtt SecurityEventDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 10

  RootActivityMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-root-activity-${Stage}'
      FilterPattern: '{ ($.userIdentity.type = "Root") && ($.eventType != "AwsServiceEvent") }'
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: RootActivity
          MetricValue: '1'
          DefaultValue: 0

  CloudTrailChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-cloudtrail-change-${Stage}'
      FilterPattern: >-
        { ($.eventSource = "cloudtrail.amazonaws.com") && (($.eventName = "StopLogging") || ($.eventName = "DeleteTrail") || ($.eventName = "UpdateTrail") || ($.eventName = "PutEventSelectors")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: CloudTrailConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  IamChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-iam-change-${Stage}'
      FilterPattern: >-
        { ($.eventSource = "iam.amazonaws.com") && (($.eventName = "CreateAccessKey") || ($.eventName = "DeleteAccessKey") || ($.eventName = "AttachUserPolicy") || ($.eventName = "AttachRolePolicy") || ($.eventName = "PutUserPolicy") || ($.eventName = "PutRolePolicy") || ($.eventName = "UpdateAssumeRolePolicy")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: IamConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  KmsChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-kms-change-${Stage}'
      FilterPattern: >-
        { ($.eventSource = "kms.amazonaws.com") && (($.eventName = "DisableKey") || ($.eventName = "ScheduleKeyDeletion") || ($.eventName = "PutKeyPolicy") || ($.eventName = "DeleteAlias")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: KmsSecurityConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  SecurityRoutingChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-security-routing-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "sns.amazonaws.com") && (($.eventName = "DeleteTopic") || ($.eventName = "SetTopicAttributes") || ($.eventName = "Subscribe") || ($.eventName = "ConfirmSubscription") || ($.eventName = "Unsubscribe"))) || (($.eventSource = "events.amazonaws.com") && (($.eventName = "DeleteRule") || ($.eventName = "DisableRule") || ($.eventName = "EnableRule") || ($.eventName = "PutRule") || ($.eventName = "RemoveTargets") || ($.eventName = "PutTargets"))) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: SecurityRoutingConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  SecurityServiceChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-security-service-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "config.amazonaws.com") && (($.eventName = "StopConfigurationRecorder") || ($.eventName = "DeleteConfigurationRecorder") || ($.eventName = "DeleteDeliveryChannel") || ($.eventName = "DeleteConfigRule"))) || (($.eventSource = "guardduty.amazonaws.com") && (($.eventName = "DeleteDetector") || ($.eventName = "UpdateDetector") || ($.eventName = "UpdateMemberDetectors"))) || (($.eventSource = "securityhub.amazonaws.com") && (($.eventName = "DisableSecurityHub") || ($.eventName = "BatchDisableStandards") || ($.eventName = "UpdateStandardsControl"))) || (($.eventSource = "inspector2.amazonaws.com") && ($.eventName = "Disable")) || (($.eventSource = "access-analyzer.amazonaws.com") && ($.eventName = "DeleteAnalyzer")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: SecurityServiceConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  DetectionTopologyChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-detection-topology-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "config.amazonaws.com") && (($.eventName = "PutConfigurationRecorder") || ($.eventName = "PutDeliveryChannel") || ($.eventName = "PutConfigRule"))) || (($.eventSource = "guardduty.amazonaws.com") && (($.eventName = "CreateMembers") || ($.eventName = "DisassociateMembers"))) || (($.eventSource = "securityhub.amazonaws.com") && (($.eventName = "CreateFindingAggregator") || ($.eventName = "UpdateFindingAggregator") || ($.eventName = "DeleteFindingAggregator") || ($.eventName = "UpdateSecurityHubConfiguration"))) || (($.eventSource = "inspector2.amazonaws.com") && ($.eventName = "Enable")) || (($.eventSource = "access-analyzer.amazonaws.com") && ($.eventName = "UpdateAnalyzer")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: SecurityServiceConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  ManagedSecurityOrganizationChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-managed-security-org-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "guardduty.amazonaws.com") && (($.eventName = "DeleteMembers") || ($.eventName = "DisableOrganizationAdminAccount") || ($.eventName = "DisassociateFromAdministratorAccount") || ($.eventName = "StopMonitoringMembers") || ($.eventName = "UpdateOrganizationConfiguration") || ($.eventName = "UpdateOrganizationConfiguration2"))) || (($.eventSource = "securityhub.amazonaws.com") && (($.eventName = "BatchUpdateStandardsControlAssociations") || ($.eventName = "DeleteMembers") || ($.eventName = "DisableOrganizationAdminAccount") || ($.eventName = "DisassociateFromAdministratorAccount"))) || (($.eventSource = "inspector2.amazonaws.com") && ($.eventName = "DisassociateMember")) || (($.eventSource = "access-analyzer.amazonaws.com") && (($.eventName = "CreateArchiveRule") || ($.eventName = "UpdateArchiveRule") || ($.eventName = "DeleteArchiveRule"))) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: SecurityServiceConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  DataProtectionChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-data-protection-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "s3.amazonaws.com") && (($.eventName = "DeleteBucketPolicy") || ($.eventName = "DeletePublicAccessBlock") || ($.eventName = "DeleteBucketEncryption") || ($.eventName = "PutBucketPolicy") || ($.eventName = "PutBucketPublicAccessBlock") || ($.eventName = "PutBucketVersioning") || ($.eventName = "PutBucketEncryption") || ($.eventName = "PutBucketLogging") || ($.eventName = "PutBucketAcl"))) || (($.eventSource = "dynamodb.amazonaws.com") && (($.eventName = "DeleteTable") || ($.eventName = "UpdateContinuousBackups") || ($.eventName = "UpdateTable"))) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: DataProtectionConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  BackupProtectionChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-backup-protection-change-${Stage}'
      FilterPattern: >-
        { ($.eventSource = "backup.amazonaws.com") && (($.eventName = "DeleteBackupVault") || ($.eventName = "DeleteRecoveryPoint") || ($.eventName = "PutBackupVaultLockConfiguration") || ($.eventName = "DeleteBackupVaultLockConfiguration") || ($.eventName = "DeleteBackupVaultAccessPolicy") || ($.eventName = "PutBackupVaultAccessPolicy") || ($.eventName = "DeleteBackupPlan") || ($.eventName = "UpdateBackupPlan") || ($.eventName = "DeleteBackupSelection") || ($.eventName = "UpdateRecoveryPointLifecycle")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: DataProtectionConfigurationChange
