AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Website-only notification routing and audit-only account alarms. Alert payloads
  are privacy-safe operational signals, so the topic avoids a dedicated monthly
  KMS key. This stack preserves an existing owner-approved subscription.

Parameters:
  Stage:
    Type: String
    Default: prod
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,18}[a-z0-9])?$'
    ConstraintDescription: Use 1-20 lowercase letters, digits, or internal hyphens.
  SecurityAuditLogGroupName:
    Type: String
    MinLength: 1
    MaxLength: 512
    AllowedPattern: '^/[A-Za-z0-9._/#-]+$'
    Description: Exact CloudWatch log group name output by the audit foundation stack.

Resources:
  SecurityNotifications:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'ian-photography-security-${Stage}'
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecurityNotificationsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SecurityNotifications
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowExactWebsiteCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SecurityNotifications
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                AWS:SourceArn:
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-website-ApiServerErrorAlarm-*'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-website-ApiLatencyAlarm-*'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-website-FrontDoorDeniedAlarm-*'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-website-AsyncFailureQueueAlarm-*'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-website-PreviewDeadLetterQueueAlarm-*'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-website-PreviewQueueAgeAlarm-*'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-website-PreviewMetadataSystemErrorsAlarm-*'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-website-AuditFailureAlarm-*'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-frontend-5xx-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-media-5xx-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-backup-freshness-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ian-photography-security-events-dlq-${Stage}'

  SecuritySignalQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ian-photography-security-signals-${Stage}'
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SecurityEventDlq.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecuritySignalQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SecuritySignalQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowExactSecuritySignalRules
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SecuritySignalQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn:
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-backup-job-failed-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-waf-alarm-${Stage}'

  SecurityEventDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ian-photography-security-events-${Stage}-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecurityEventDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SecurityEventDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowExactSecurityRules
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SecurityEventDlq.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn:
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-backup-job-failed-${Stage}'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ian-photography-waf-alarm-${Stage}'

  SecuritySignalProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ian-photography-security-signal-processor-${Stage}'
      RetentionInDays: 90
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecuritySignalProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ConsumeExactSecuritySignalQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt SecuritySignalQueue.Arn
        - PolicyName: PublishValidatedSecuritySignals
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref SecurityNotifications
        - PolicyName: WriteSecuritySignalProcessorLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt SecuritySignalProcessorLogGroup.Arn
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecuritySignalProcessor:
    Type: AWS::Lambda::Function
    DependsOn: SecuritySignalProcessorLogGroup
    Properties:
      FunctionName: !Sub 'ian-photography-security-signal-processor-${Stage}'
      Description: Validates fixed security signals before publishing to the responder topic.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SecuritySignalProcessorRole.Arn
      MemorySize: 128
      Timeout: 30
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          SECURITY_TOPIC_ARN: !Ref SecurityNotifications
          STAGE: !Ref Stage
      Code:
        ZipFile: |
          import json
          import logging
          import os

          import boto3


          LOG = logging.getLogger()
          LOG.setLevel(logging.INFO)
          SNS = boto3.client("sns")
          TOPIC_ARN = os.environ["SECURITY_TOPIC_ARN"]
          STAGE = os.environ["STAGE"]
          CONTRACTS = {
              "backup.job.failed": ("high", "backup-job-failure"),
              "waf.alarm": ("high", "waf-observation"),
              "edge.alarm": ("high", "edge-health"),
          }
          KEYS = {"schemaVersion", "eventName", "severity", "stage", "runbook"}


          def _validated(body):
              try:
                  value = json.loads(body)
              except (TypeError, ValueError) as error:
                  raise ValueError("invalid security signal json") from error
              if isinstance(value, dict) and set(value) == {"schemaVersion", "alarmName", "stage"}:
                  names = {
                      "ian-photography-waf-blocked-" + STAGE: "waf.alarm",
                      "ian-photography-frontend-5xx-" + STAGE: "edge.alarm",
                      "ian-photography-media-5xx-" + STAGE: "edge.alarm",
                  }
                  event_name = names.get(value.get("alarmName"))
                  if event_name is None or value["schemaVersion"] != 1 or value["stage"] != STAGE:
                      raise ValueError("unknown edge alarm signal")
                  severity, anchor = CONTRACTS[event_name]
                  value = {"schemaVersion": 1, "eventName": event_name,
                           "severity": severity, "stage": STAGE,
                           "runbook": "ops/ALARM_REGISTRY.md#" + anchor}
              if not isinstance(value, dict) or set(value) != KEYS:
                  raise ValueError("invalid security signal shape")
              contract = CONTRACTS.get(value.get("eventName"))
              if contract is None:
                  raise ValueError("unknown security signal")
              severity, anchor = contract
              expected = {
                  "schemaVersion": 1,
                  "eventName": value["eventName"],
                  "severity": severity,
                  "stage": STAGE,
                  "runbook": "ops/ALARM_REGISTRY.md#" + anchor,
              }
              if value != expected:
                  raise ValueError("security signal contract mismatch")
              return expected


          def handler(event, context):
              records = event.get("Records", []) if isinstance(event, dict) else []
              if len(records) != 1 or not isinstance(records[0], dict):
                  raise ValueError("invalid security signal batch")
              signal = _validated(records[0].get("body"))
              SNS.publish(
                  TopicArn=TOPIC_ARN,
                  Message=json.dumps(signal, sort_keys=True, separators=(",", ":")),
              )
              LOG.info("security_signal_forwarded count=1")
              return {"forwarded": 1}
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecuritySignalProcessorMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt SecuritySignalQueue.Arn
      FunctionName: !Ref SecuritySignalProcessor

  WafAlarmForwardRule:
    Type: AWS::Events::Rule
    DependsOn:
      - SecuritySignalQueuePolicy
      - SecurityEventDlqPolicy
    Properties:
      Name: !Sub 'ian-photography-waf-alarm-${Stage}'
      Description: Converts exact us-east-1 website edge and WAF alarms into validated fixed signals.
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change]
        account: [!Ref AWS::AccountId]
        region: [us-east-1]
        detail:
          alarmName:
            - !Sub 'ian-photography-waf-blocked-${Stage}'
            - !Sub 'ian-photography-frontend-5xx-${Stage}'
            - !Sub 'ian-photography-media-5xx-${Stage}'
          state:
            value: [ALARM]
      State: ENABLED
      Targets:
        - Id: SecuritySignalQueue
          Arn: !GetAtt SecuritySignalQueue.Arn
          InputTransformer:
            InputPathsMap:
              alarmName: $.detail.alarmName
            InputTemplate: !Sub >-
              {"schemaVersion":1,"alarmName":<alarmName>,"stage":"${Stage}"}
          DeadLetterConfig:
            Arn: !GetAtt SecurityEventDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 10

  RootActivityMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-root-activity-${Stage}'
      FilterPattern: '{ ($.userIdentity.type = "Root") && ($.eventType != "AwsServiceEvent") }'
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: RootActivity
          MetricValue: '1'
          DefaultValue: 0

  CloudTrailChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-cloudtrail-change-${Stage}'
      FilterPattern: >-
        { ($.eventSource = "cloudtrail.amazonaws.com") && (($.eventName = "StopLogging") || ($.eventName = "DeleteTrail") || ($.eventName = "UpdateTrail") || ($.eventName = "PutEventSelectors")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: CloudTrailConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  IamChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-iam-change-${Stage}'
      FilterPattern: >-
        { ($.eventSource = "iam.amazonaws.com") && (($.eventName = "CreateAccessKey") || ($.eventName = "DeleteAccessKey") || ($.eventName = "AttachUserPolicy") || ($.eventName = "AttachRolePolicy") || ($.eventName = "PutUserPolicy") || ($.eventName = "PutRolePolicy") || ($.eventName = "UpdateAssumeRolePolicy")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: IamConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  KmsChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-kms-change-${Stage}'
      FilterPattern: >-
        { ($.eventSource = "kms.amazonaws.com") && (($.eventName = "DisableKey") || ($.eventName = "ScheduleKeyDeletion") || ($.eventName = "PutKeyPolicy") || ($.eventName = "DeleteAlias")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: KmsSecurityConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  SecurityRoutingChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-security-routing-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "sns.amazonaws.com") && (($.eventName = "DeleteTopic") || ($.eventName = "SetTopicAttributes") || ($.eventName = "Subscribe") || ($.eventName = "ConfirmSubscription") || ($.eventName = "Unsubscribe"))) || (($.eventSource = "events.amazonaws.com") && (($.eventName = "DeleteRule") || ($.eventName = "DisableRule") || ($.eventName = "EnableRule") || ($.eventName = "PutRule") || ($.eventName = "RemoveTargets") || ($.eventName = "PutTargets"))) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: SecurityRoutingConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  SecurityServiceChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-security-service-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "config.amazonaws.com") && (($.eventName = "StopConfigurationRecorder") || ($.eventName = "DeleteConfigurationRecorder") || ($.eventName = "DeleteDeliveryChannel") || ($.eventName = "DeleteConfigRule"))) || (($.eventSource = "guardduty.amazonaws.com") && (($.eventName = "DeleteDetector") || ($.eventName = "UpdateDetector") || ($.eventName = "UpdateMemberDetectors"))) || (($.eventSource = "securityhub.amazonaws.com") && (($.eventName = "DisableSecurityHub") || ($.eventName = "BatchDisableStandards") || ($.eventName = "UpdateStandardsControl"))) || (($.eventSource = "inspector2.amazonaws.com") && ($.eventName = "Disable")) || (($.eventSource = "access-analyzer.amazonaws.com") && ($.eventName = "DeleteAnalyzer")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: SecurityServiceConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  DetectionTopologyChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-detection-topology-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "config.amazonaws.com") && (($.eventName = "PutConfigurationRecorder") || ($.eventName = "PutDeliveryChannel") || ($.eventName = "PutConfigRule"))) || (($.eventSource = "guardduty.amazonaws.com") && (($.eventName = "CreateMembers") || ($.eventName = "DisassociateMembers"))) || (($.eventSource = "securityhub.amazonaws.com") && (($.eventName = "CreateFindingAggregator") || ($.eventName = "UpdateFindingAggregator") || ($.eventName = "DeleteFindingAggregator") || ($.eventName = "UpdateSecurityHubConfiguration"))) || (($.eventSource = "inspector2.amazonaws.com") && ($.eventName = "Enable")) || (($.eventSource = "access-analyzer.amazonaws.com") && ($.eventName = "UpdateAnalyzer")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: SecurityServiceConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  ManagedSecurityOrganizationChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-managed-security-org-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "guardduty.amazonaws.com") && (($.eventName = "DeleteMembers") || ($.eventName = "DisableOrganizationAdminAccount") || ($.eventName = "DisassociateFromAdministratorAccount") || ($.eventName = "StopMonitoringMembers") || ($.eventName = "UpdateOrganizationConfiguration") || ($.eventName = "UpdateOrganizationConfiguration2"))) || (($.eventSource = "securityhub.amazonaws.com") && (($.eventName = "BatchUpdateStandardsControlAssociations") || ($.eventName = "DeleteMembers") || ($.eventName = "DisableOrganizationAdminAccount") || ($.eventName = "DisassociateFromAdministratorAccount"))) || (($.eventSource = "inspector2.amazonaws.com") && ($.eventName = "DisassociateMember")) || (($.eventSource = "access-analyzer.amazonaws.com") && (($.eventName = "CreateArchiveRule") || ($.eventName = "UpdateArchiveRule") || ($.eventName = "DeleteArchiveRule"))) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: SecurityServiceConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  DataProtectionChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-data-protection-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "s3.amazonaws.com") && (($.eventName = "DeleteBucketPolicy") || ($.eventName = "DeletePublicAccessBlock") || ($.eventName = "DeleteBucketEncryption") || ($.eventName = "PutBucketPolicy") || ($.eventName = "PutBucketPublicAccessBlock") || ($.eventName = "PutBucketVersioning") || ($.eventName = "PutBucketEncryption") || ($.eventName = "PutBucketLogging") || ($.eventName = "PutBucketAcl"))) || (($.eventSource = "dynamodb.amazonaws.com") && (($.eventName = "DeleteTable") || ($.eventName = "UpdateContinuousBackups") || ($.eventName = "UpdateTable"))) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: DataProtectionConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  BackupProtectionChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-backup-protection-change-${Stage}'
      FilterPattern: >-
        { ($.eventSource = "backup.amazonaws.com") && (($.eventName = "DeleteBackupVault") || ($.eventName = "DeleteRecoveryPoint") || ($.eventName = "PutBackupVaultLockConfiguration") || ($.eventName = "DeleteBackupVaultLockConfiguration") || ($.eventName = "DeleteBackupVaultAccessPolicy") || ($.eventName = "PutBackupVaultAccessPolicy") || ($.eventName = "DeleteBackupPlan") || ($.eventName = "UpdateBackupPlan") || ($.eventName = "DeleteBackupSelection") || ($.eventName = "UpdateRecoveryPointLifecycle")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: DataProtectionConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  DataRetentionAndOwnershipChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-data-retention-ownership-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "s3.amazonaws.com") && (($.eventName = "DeleteBucketLifecycle") || ($.eventName = "PutBucketLifecycleConfiguration") || ($.eventName = "DeleteBucketOwnershipControls") || ($.eventName = "PutBucketOwnershipControls") || ($.eventName = "DeleteBucketReplication") || ($.eventName = "PutBucketReplication") || ($.eventName = "PutObjectLockConfiguration"))) || (($.eventSource = "dynamodb.amazonaws.com") && ($.eventName = "UpdateTimeToLive")) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: DataProtectionConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  InfrastructureProtectionChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-infrastructure-protection-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "cloudformation.amazonaws.com") && (($.eventName = "DeleteStack") || ($.eventName = "SetStackPolicy") || ($.eventName = "UpdateTerminationProtection"))) || (($.eventSource = "cloudfront.amazonaws.com") && (($.eventName = "DeleteDistribution") || ($.eventName = "UpdateDistribution"))) || (($.eventSource = "wafv2.amazonaws.com") && (($.eventName = "DeleteWebACL") || ($.eventName = "UpdateWebACL") || ($.eventName = "DeleteLoggingConfiguration"))) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: InfrastructureProtectionConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  InfrastructureExecutionChangeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroupName
      FilterName: !Sub 'ian-photography-infrastructure-execution-change-${Stage}'
      FilterPattern: >-
        { (($.eventSource = "cloudformation.amazonaws.com") && (($.eventName = "UpdateStack") || ($.eventName = "ExecuteChangeSet") || ($.eventName = "RollbackStack"))) || (($.eventSource = "wafv2.amazonaws.com") && (($.eventName = "AssociateWebACL") || ($.eventName = "DisassociateWebACL") || ($.eventName = "PutLoggingConfiguration"))) || (($.eventSource = "cloudfront.amazonaws.com") && (($.eventName = "CreateContinuousDeploymentPolicy") || ($.eventName = "UpdateContinuousDeploymentPolicy") || ($.eventName = "DeleteContinuousDeploymentPolicy"))) }
      MetricTransformations:
        - MetricNamespace: IanTruongPhotography/Security
          MetricName: InfrastructureProtectionConfigurationChange
          MetricValue: '1'
          DefaultValue: 0

  RootActivityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-root-activity-${Stage}'
      AlarmDescription: Root identity performed an AWS API action.
      Namespace: IanTruongPhotography/Security
      MetricName: RootActivity
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CloudTrailChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-cloudtrail-change-${Stage}'
      AlarmDescription: CloudTrail configuration or logging was changed.
      Namespace: IanTruongPhotography/Security
      MetricName: CloudTrailConfigurationChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IamChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-iam-change-${Stage}'
      AlarmDescription: A high-impact IAM configuration action occurred.
      Namespace: IanTruongPhotography/Security
      MetricName: IamConfigurationChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  KmsChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-kms-change-${Stage}'
      AlarmDescription: A KMS key or alias security setting was changed.
      Namespace: IanTruongPhotography/Security
      MetricName: KmsSecurityConfigurationChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SecurityRoutingChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-security-routing-change-${Stage}'
      AlarmDescription: Security notification routing was changed.
      Namespace: IanTruongPhotography/Security
      MetricName: SecurityRoutingConfigurationChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SecurityServiceChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-security-service-change-${Stage}'
      AlarmDescription: A managed detection, configuration, or analyzer control was disabled or changed.
      Namespace: IanTruongPhotography/Security
      MetricName: SecurityServiceConfigurationChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DataProtectionChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-data-protection-change-${Stage}'
      AlarmDescription: A data, backup, logging, versioning, or public-access protection was changed.
      Namespace: IanTruongPhotography/Security
      MetricName: DataProtectionConfigurationChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  InfrastructureProtectionChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-infrastructure-protection-change-${Stage}'
      AlarmDescription: A protected stack, edge distribution, or web ACL was changed or weakened.
      Namespace: IanTruongPhotography/Security
      MetricName: InfrastructureProtectionConfigurationChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SecurityEventDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ian-photography-security-events-dlq-${Stage}'
      AlarmDescription: EventBridge could not deliver one or more website backup or WAF signals.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SecurityEventDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SecurityNotifications]

Outputs:
  SecurityNotificationTopicArn:
    Value: !Ref SecurityNotifications
    Description: Website-only responder topic; attach only an owner-approved monitored subscriber.
  SecuritySignalQueueArn:
    Value: !GetAtt SecuritySignalQueue.Arn
    Description: Exact rule-scoped ingress for static privacy-safe security signals.
  SecurityEventDeadLetterQueueArn:
    Value: !GetAtt SecurityEventDlq.Arn
