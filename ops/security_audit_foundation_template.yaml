AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Home-region audit evidence foundation for IanTruongPhotography. Deploy this
  stack once, enable termination protection, and retain the complete delivery
  dependency chain together.

Parameters:
  Stage:
    Type: String
    Default: prod
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,18}[a-z0-9])?$'
    ConstraintDescription: Use 1-20 lowercase letters, digits, or internal hyphens.
  ConfigDeliveryBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9](?:[a-z0-9.-]{1,61}[a-z0-9])$'
    ConstraintDescription: >-
      Leave empty to disable Config object data events, or provide one exact S3
      bucket name using 3-63 lowercase letters, digits, periods, or hyphens.
  CentralAccessLogBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9](?:[a-z0-9.-]{1,61}[a-z0-9])$'
    Description: Optional account-local S3 server-access-log destination.

Conditions:
  AuditConfigDeliveryObjectEvents: !Not
    - !Equals
      - !Ref ConfigDeliveryBucketName
      - ''
  EnableCentralAccessLogging: !Not
    - !Equals
      - !Ref CentralAccessLogBucketName
      - ''

Resources:
  SecurityAuditKey:
    Type: AWS::KMS::Key
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encryption for immutable CloudTrail audit evidence
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIamPolicies
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowCloudTrailEncryption
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ian-photography-security-${Stage}'
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub 'arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*'
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityAuditEvidence

  SecurityAuditKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: !Sub 'alias/ian-photography-security-audit-${Stage}'
      TargetKeyId: !Ref SecurityAuditKey

  SecurityAuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt SecurityAuditKey.Arn
            BucketKeyEnabled: true
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 365
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveRetainedSecurityEvidence
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
            NoncurrentVersionTransitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
            ExpirationInDays: 2555
            NoncurrentVersionExpiration:
              NoncurrentDays: 2555
      LoggingConfiguration: !If
        - EnableCentralAccessLogging
        - DestinationBucketName: !Ref CentralAccessLogBucketName
          LogFilePrefix: s3-account/security-audit/
        - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityAuditEvidence

  SecurityAuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref SecurityAuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SecurityAuditBucket.Arn
              - !Sub '${SecurityAuditBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: CloudTrailBucketAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt SecurityAuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ian-photography-security-${Stage}'
          - Sid: CloudTrailLogDelivery
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${SecurityAuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ian-photography-security-${Stage}'
                s3:x-amz-acl: bucket-owner-full-control
  SecurityAuditLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/security/ian-photography-${Stage}'
      RetentionInDays: 365
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityAuditEvidence

  CloudTrailLogsRole:
    Type: AWS::IAM::Role
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ian-photography-security-${Stage}'
      Policies:
        - PolicyName: WriteOnlySecurityAuditLogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt SecurityAuditLogGroup.Arn
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecurityTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: SecurityAuditBucketPolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TrailName: !Sub 'ian-photography-security-${Stage}'
      S3BucketName: !Ref SecurityAuditBucket
      KMSKeyId: !GetAtt SecurityAuditKey.Arn
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      IsLogging: true
      CloudWatchLogsLogGroupArn: !GetAtt SecurityAuditLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailLogsRole.Arn
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All
          DataResources:
            - !If
              - AuditConfigDeliveryObjectEvents
              - Type: AWS::S3::Object
                Values:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ConfigDeliveryBucketName}/'
              - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

Outputs:
  SecurityAuditBucketName:
    Value: !Ref SecurityAuditBucket
  SecurityAuditBucketArn:
    Value: !GetAtt SecurityAuditBucket.Arn
  SecurityAuditLogGroupName:
    Value: !Ref SecurityAuditLogGroup
  CloudTrailArn:
    Value: !GetAtt SecurityTrail.Arn
  CloudTrailName:
    Value: !Ref SecurityTrail
  SecurityAuditKeyArn:
    Value: !GetAtt SecurityAuditKey.Arn
