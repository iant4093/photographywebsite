AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Home-region audit evidence foundation for IanTruongPhotography. Deploy this
  stack once, enable termination protection, and retain the complete delivery
  dependency chain together.

Parameters:
  Stage:
    Type: String
    Default: prod
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,18}[a-z0-9])?$'
    ConstraintDescription: Use 1-20 lowercase letters, digits, or internal hyphens.

Resources:
  SecurityAuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 365
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveRetainedSecurityEvidence
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
            NoncurrentVersionTransitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
            ExpirationInDays: 2555
            NoncurrentVersionExpiration:
              NoncurrentDays: 2555
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityAuditEvidence

  SecurityAuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref SecurityAuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SecurityAuditBucket.Arn
              - !Sub '${SecurityAuditBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: CloudTrailBucketAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt SecurityAuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ian-photography-security-${Stage}'
          - Sid: CloudTrailLogDelivery
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${SecurityAuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ian-photography-security-${Stage}'
                s3:x-amz-acl: bucket-owner-full-control
          - Sid: ConfigBucketDiscovery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - s3:GetBucketAcl
              - s3:ListBucket
            Resource: !GetAtt SecurityAuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:config:${AWS::Region}:${AWS::AccountId}:*'
          - Sid: ConfigLogDelivery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${SecurityAuditBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                s3:x-amz-acl: bucket-owner-full-control
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:config:${AWS::Region}:${AWS::AccountId}:*'

  SecurityAuditLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/security/ian-photography-${Stage}'
      RetentionInDays: 365
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage
        - Key: DataClassification
          Value: SecurityAuditEvidence

  CloudTrailLogsRole:
    Type: AWS::IAM::Role
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ian-photography-security-${Stage}'
      Policies:
        - PolicyName: WriteOnlySecurityAuditLogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt SecurityAuditLogGroup.Arn
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

  SecurityTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: SecurityAuditBucketPolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TrailName: !Sub 'ian-photography-security-${Stage}'
      S3BucketName: !Ref SecurityAuditBucket
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      IsLogging: true
      CloudWatchLogsLogGroupArn: !GetAtt SecurityAuditLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailLogsRole.Arn
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All
      Tags:
        - Key: Application
          Value: IanTruongPhotography
        - Key: Stage
          Value: !Ref Stage

Outputs:
  SecurityAuditBucketName:
    Value: !Ref SecurityAuditBucket
  SecurityAuditBucketArn:
    Value: !GetAtt SecurityAuditBucket.Arn
  SecurityAuditLogGroupName:
    Value: !Ref SecurityAuditLogGroup
  CloudTrailArn:
    Value: !GetAtt SecurityTrail.Arn
  CloudTrailName:
    Value: !Ref SecurityTrail

