name: Reusable quality gate

on:
  workflow_call:
    inputs:
      publish_release_artifacts:
        description: Upload deployable artifacts only for trusted main releases
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  frontend-unit-build:
    name: Frontend coverage and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:coverage
      - name: Run preview worker contract tests
        run: |
          if [[ -f backend/preview_worker/package-lock.json ]]; then
            npm ci --ignore-scripts --prefix backend/preview_worker
            npm run test:coverage --prefix backend/preview_worker
          elif [[ -f backend/preview_worker/contract.test.mjs ]]; then
            node --test backend/preview_worker/contract.test.mjs
          fi
      - name: Validate production public configuration
        if: inputs.publish_release_artifacts
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
          API_ORIGIN_URL: ${{ vars.API_ORIGIN_URL }}
          EXECUTE_API_URL: ${{ vars.EXECUTE_API_URL }}
          MEDIA_DOMAIN: ${{ vars.VITE_CLOUDFRONT_DOMAIN }}
          MEDIA_BUCKET_NAME: ${{ vars.MEDIA_BUCKET_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED_PUBLIC_ALBUM_COUNT: ${{ vars.EXPECTED_PUBLIC_ALBUM_COUNT }}
          USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          for name in API_URL API_ORIGIN_URL EXECUTE_API_URL MEDIA_DOMAIN MEDIA_BUCKET_NAME SITE_URL EXPECTED_PUBLIC_ALBUM_COUNT USER_POOL_ID CLIENT_ID TURNSTILE_SITE_KEY; do
            [[ -n "${!name:-}" ]] || { echo "Required public build variable is missing: $name" >&2; exit 2; }
            [[ "${!name}" != *example* && "${!name}" != *EXAMPLE* ]] || { echo "Placeholder public build variable is forbidden." >&2; exit 2; }
          done
          [[ "$API_URL" == "/api" || "$API_URL" == https://* ]] || {
            echo 'Production API base must be same-origin /api or an HTTPS URL.' >&2
            exit 2
          }
          execute_api_pattern='^https://[a-z0-9]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com/[A-Za-z0-9_$-]+/?$'
          [[ "$SITE_URL" == https://* && "$API_ORIGIN_URL" == https://*/api && "$EXECUTE_API_URL" =~ $execute_api_pattern ]] || {
            echo 'Production public posture URLs do not match their required HTTPS forms.' >&2
            exit 2
          }
          [[ "$EXPECTED_PUBLIC_ALBUM_COUNT" =~ ^[1-9][0-9]{0,3}$ ]] || {
            echo 'Expected public album count must be a positive reviewed integer.' >&2
            exit 2
          }
      - name: Build production bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.example.invalid/prod' }}
          VITE_CLOUDFRONT_DOMAIN: ${{ vars.VITE_CLOUDFRONT_DOMAIN || 'media.example.invalid' }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID || 'us-west-2_EXAMPLE' }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID || 'example-client-id' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
          VITE_RELEASE_SHA: ${{ github.sha }}
        run: npm run build
      - name: Create exact frontend artifact
        run: |
          mkdir -p release-frontend
          cp -R dist release-frontend/dist
          python3 ops/ci/release_guard.py build-manifest release-frontend/dist release-frontend/manifest.json
      - name: Enforce frontend performance budgets
        run: |
          python3 ops/ci/artifact_budget.py \
            --config ops/ci/artifact_budgets.json \
            --output evidence/frontend-artifact-budget.json \
            frontend \
            --root release-frontend/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && inputs.publish_release_artifacts
        with:
          name: release-frontend
          path: release-frontend
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: coverage/frontend
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-artifact-budget
          path: evidence/frontend-artifact-budget.json
          if-no-files-found: warn
          retention-days: 30

  backend-unit:
    name: Backend coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run all backend tests with branch coverage
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-west-2
          PYTHONPATH: functions
        run: |
          python -m coverage run --rcfile=.coveragerc -m unittest discover -s tests -p 'test_*.py' -v
          python -m coverage json --rcfile=.coveragerc --fail-under=0
          python -m coverage report --rcfile=.coveragerc --fail-under=0
          python -m coverage xml --rcfile=.coveragerc --fail-under=0
          python ../ops/ci/coverage_gate.py coverage/backend/coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/backend
          if-no-files-found: warn
          retention-days: 30

  infrastructure:
    name: Infrastructure, ops coverage, and SAM build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          version: 1.154.0
      - run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Run ops tests with complete-source branch coverage
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-west-2
          PYTHONPATH: .
        run: |
          python -m coverage run --rcfile=ops/.coveragerc -m unittest discover -s ops/tests -p 'test_*.py' -v
          python -m coverage json --rcfile=ops/.coveragerc --fail-under=0
          python -m coverage report --rcfile=ops/.coveragerc --fail-under=0
          python -m coverage xml --rcfile=ops/.coveragerc --fail-under=0
          python ops/ci/coverage_gate.py coverage/ops/coverage.json
      - name: Validate and build SAM from scratch
        run: ./ops/validate_infrastructure.sh --build
      - name: Enforce reviewed Lambda environment contract
        run: |
          python3 ops/ci/release_guard.py template-environment-policy backend/template.yaml ops/ci/template_environment_policy.json --template-kind source
          python3 ops/ci/release_guard.py template-environment-policy backend/.aws-sam/build/template.yaml ops/ci/template_environment_policy.json --template-kind built
      - name: Refuse credential-like build artifacts
        run: python3 ops/ci/credential_artifact_scan.py backend/.aws-sam/build
      - name: Enforce SAM artifact budgets and source isolation
        run: |
          python3 ops/ci/artifact_budget.py \
            --config ops/ci/artifact_budgets.json \
            --output evidence/backend-artifact-budget.json \
            sam \
            --build-root backend/.aws-sam/build \
            --makefile backend/Makefile \
            --template backend/template.yaml \
            --source-root backend/functions
      - name: Create exact backend artifact
        run: |
          mkdir -p release-backend
          tar -czf release-backend/backend-build.tar.gz -C backend .aws-sam/build
          python3 ops/ci/release_guard.py build-manifest release-backend release-backend/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && inputs.publish_release_artifacts
        with:
          name: release-backend
          path: release-backend
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ops-coverage
          path: coverage/ops
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-artifact-budget
          path: evidence/backend-artifact-budget.json
          if-no-files-found: warn
          retention-days: 30

  dependency-workflow-security:
    name: Dependency and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Audit dependencies and create CycloneDX SBOMs
        run: |
          mkdir -p release-sbom
          npm sbom --sbom-format=cyclonedx > release-sbom/frontend.cdx.json
          python -m pip_audit -r backend/requirements-dev.txt
          python -m pip_audit -r backend/requirements.txt --format cyclonedx-json --output release-sbom/backend.cdx.json
          if [[ -f backend/preview_worker/package-lock.json ]]; then
            npm ci --ignore-scripts --prefix backend/preview_worker
            npm audit --audit-level=low --prefix backend/preview_worker
            (cd backend/preview_worker && npm sbom --sbom-format=cyclonedx) > release-sbom/preview-worker.cdx.json
          fi
      - name: Enforce workflow policy
        run: |
          python3 ops/ci/workflow_policy.py .github/workflows/*.yml
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint .github/workflows/*.yml
          zizmor --persona regular --min-severity medium .github
      - name: Independent CloudFormation lint
        run: >-
          cfn-lint
          backend/template.yaml
          ops/ci_bootstrap_template.yaml
          ops/dnssec-key-template.yaml
          ops/security_audit_foundation_template.yaml
          ops/security_notifications_template.yaml
          ops/security_managed_services_template.yaml
          ops/security_backup_template.yaml
          ops/security_backup_replica_template.yaml
          ops/observability_template.yaml
          ops/waf_front_door_template.yaml
      - name: Scan complete reachable history without echoing values or paths
        run: python3 ops/ci/git_history_credential_scan.py .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && inputs.publish_release_artifacts
        with:
          name: release-sbom
          path: release-sbom
          if-no-files-found: error
          retention-days: 90

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@0b1f0509b2ddb4dc7bd94367abfe7ad1d8a1b810 # v3.30.5
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@0b1f0509b2ddb4dc7bd94367abfe7ad1d8a1b810 # v3.30.5

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - frontend-unit-build
      - backend-unit
      - infrastructure
      - dependency-workflow-security
      - codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every independent quality domain
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if failed:
              print('Quality domains did not pass: ' + ', '.join(sorted(failed)), file=sys.stderr)
              raise SystemExit(1)
          PY
