name: Scheduled security and drift audit

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-security
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    permissions:
      contents: read
      security-events: write

  history-and-public-posture:
    name: Full-history credentials and public posture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require trusted default-branch controls
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Production audit controls must run from main.' >&2
            exit 2
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every reachable Git blob without echoing findings
        run: python3 ops/ci/git_history_credential_scan.py .
      - name: Run credential-free public security and completeness checks
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_URL: ${{ vars.SITE_URL }}
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          API_ORIGIN_URL: ${{ vars.API_ORIGIN_URL }}
          EXECUTE_API_URL: ${{ vars.EXECUTE_API_URL }}
          MEDIA_DOMAIN: ${{ vars.VITE_CLOUDFRONT_DOMAIN }}
          MEDIA_BUCKET_NAME: ${{ vars.MEDIA_BUCKET_NAME }}
          EXPECTED_PUBLIC_ALBUM_COUNT: ${{ vars.EXPECTED_PUBLIC_ALBUM_COUNT }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: ./ops/ci/public_smoke.sh

  production-drift:
    name: Read-only multi-stack production drift check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require trusted default-branch controls
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Production audit controls must run from main.' >&2
            exit 2
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_ROLE_ARN }}
          role-session-name: audit-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Detect but never remediate versioned stack inventory
        run: ./ops/ci/audit_stack_drift.sh
