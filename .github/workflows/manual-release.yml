name: Manual verified redeploy or forward rollback

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Release production workflow run ID
        required: true
        type: string
      source_sha:
        description: Exact 40-character main commit SHA from that run
        required: true
        type: string
      layers:
        description: Layer(s) to redeploy from the attested release
        required: true
        default: both
        type: choice
        options: [frontend, backend, both]

permissions: {}

concurrency:
  group: iantruongphotography-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify selected known-good release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a successful main release and trusted commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Run ID must be numeric.' >&2; exit 2; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Source SHA must be exact.' >&2; exit 2; }
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '[.head_sha,.head_branch,.conclusion,.event,.name] | @tsv')"
          IFS=$'\t' read -r actual_sha branch conclusion event workflow_name <<< "$metadata"
          [[ "$actual_sha" == "$SOURCE_SHA" && "$branch" == 'main' && "$conclusion" == 'success' && "$event" == 'push' && "$workflow_name" == 'Release production' ]] || {
            echo 'Selected workflow is not a successful production release for that SHA.' >&2
            exit 2
          }
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo 'Selected commit is not in current main history.' >&2
            exit 2
          }
          git checkout --detach "$SOURCE_SHA"
          gh run download "$SOURCE_RUN_ID" --name attested-release --dir release
          python3 ops/ci/release_guard.py verify-manifest release/frontend/dist release/frontend/manifest.json
          python3 ops/ci/release_guard.py verify-manifest release/backend release/backend/manifest.json --allow-sibling-manifest
          python3 ops/ci/release_guard.py verify-tar release/backend/backend-build.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-rollback-release
          path: release
          if-no-files-found: error
          retention-days: 14

  backend-plan:
    name: Plan selected backend artifact
    needs: prepare
    if: inputs.layers == 'backend' || inputs.layers == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-plan
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      change_set_id: ${{ steps.plan.outputs.change_set_id }}
      noop: ${{ steps.plan.outputs.noop }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-rollback-release
          path: release
      - run: |
          python3 ops/ci/release_guard.py verify-manifest release/backend release/backend/manifest.json --allow-sibling-manifest
          python3 ops/ci/release_guard.py verify-tar release/backend/backend-build.tar.gz
          tar -xzf release/backend/backend-build.tar.gz -C release/backend
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: rollback-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - id: plan
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ vars.AWS_STACK_NAME }}
          ARTIFACT_BUCKET: ${{ vars.AWS_RELEASE_ARTIFACT_BUCKET }}
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: ./ops/ci/backend_plan.sh

  backend-deploy:
    name: Execute selected backend artifact
    needs: backend-plan
    if: needs.backend-plan.result == 'success' && needs.backend-plan.outputs.noop != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_EXECUTE_ROLE_ARN }}
          role-session-name: rollback-execute-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ vars.AWS_STACK_NAME }}
          CHANGE_SET_ID: ${{ needs.backend-plan.outputs.change_set_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.source_sha }}
        run: ./ops/ci/backend_execute.sh

  frontend-deploy:
    name: Deploy selected frontend artifact
    needs: [prepare, backend-plan, backend-deploy]
    if: always() && needs.prepare.result == 'success' && (inputs.layers == 'frontend' || ((inputs.layers == 'both') && (needs.backend-deploy.result == 'success' || (needs.backend-deploy.result == 'skipped' && needs.backend-plan.outputs.noop == 'true'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-rollback-release
          path: release
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          role-session-name: rollback-frontend-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          FRONTEND_DISTRIBUTION_ID: ${{ vars.FRONTEND_DISTRIBUTION_ID }}
        run: ./ops/ci/frontend_deploy.sh
      - env:
          SITE_URL: ${{ vars.SITE_URL }}
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: ./ops/ci/public_smoke.sh

  backend-only-smoke:
    name: Verify backend-only redeploy
    needs: [backend-plan, backend-deploy]
    if: always() && inputs.layers == 'backend' && needs.backend-plan.result == 'success' && (needs.backend-deploy.result == 'success' || (needs.backend-deploy.result == 'skipped' && needs.backend-plan.outputs.noop == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - env:
          SITE_URL: ${{ vars.SITE_URL }}
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: ./ops/ci/public_smoke.sh
